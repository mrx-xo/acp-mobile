// --- Pinned messages: per-convo (buffer name = durable identity),
// stored in localStorage as the rendered bubble HTML so the pin
// survives replays/reloads without needing a stable message id ---
const pinsEl = document.getElementById('pins');
const pinsBody = document.getElementById('pins-body');

function pinsKey() {
  return 'pins:' + (currentBufferName || currentSessionKey || 'unknown');
}
function loadPins() {
  try { return JSON.parse(localStorage.getItem(pinsKey())) || []; }
  catch { return []; }
}
function savePins(pins) {
  try { localStorage.setItem(pinsKey(), JSON.stringify(pins)); }
  catch (e) { console.warn('pin save failed', e); }
}
function msgPinText(el) { return el._text || el.textContent.trim(); }
function isPinned(el) {
  const text = msgPinText(el);
  return loadPins().some(p => p.text === text);
}
function togglePin(el) {
  // Full image data URLs do not belong in durable localStorage. Besides
  // retaining sent photos after the session, a few images can exhaust its
  // small quota and prevent unrelated pins from saving.
  if (el.querySelector('.sent-images img')) return;
  const text = msgPinText(el);
  let pins = loadPins();
  if (pins.some(p => p.text === text)) {
    pins = pins.filter(p => p.text !== text);
  } else {
    const clone = el.cloneNode(true);
    clone.removeAttribute('id');
    clone.classList.remove('msg-in');
    pins.push({
      html: clone.outerHTML, text,
      role: el.classList.contains('user') ? 'You' :
            el.classList.contains('agent') ? 'Agent' :
            el.classList.contains('tool') ? 'Tool' : '',
      ts: Date.now()
    });
  }
  savePins(pins);
}
function buildPinItem(p, storageKey, rerender) {
  const item = document.createElement('div');
  item.className = 'pin-item';
  const meta = document.createElement('div');
  meta.className = 'pin-meta';
  const when = new Date(p.ts);
  const label = document.createElement('span');
  label.textContent = (p.role ? p.role + ' · ' : '') +
    when.toLocaleDateString() + ' ' +
    when.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const unpin = document.createElement('button');
  unpin.className = 'pin-unpin';
  unpin.textContent = 'Unpin';
  unpin.onclick = (e) => {
    e.stopPropagation();
    try {
      const arr = (JSON.parse(localStorage.getItem(storageKey)) || [])
        .filter(q => q.ts !== p.ts);
      if (arr.length) localStorage.setItem(storageKey, JSON.stringify(arr));
      else localStorage.removeItem(storageKey);
    } catch (e2) { console.warn('unpin failed', e2); }
    rerender();
  };
  meta.appendChild(label);
  meta.appendChild(unpin);
  const holder = document.createElement('div');
  holder.innerHTML = p.html;
  // A pin stores the bubble as it was rendered, so without this it would
  // keep the renderer and theme of the day it was pinned forever. Re-render
  // the markdown body from the saved source: a pin then always looks like
  // the same message looks in the chat today.
  const pinned = holder.querySelector('.msg');
  const body = pinned && pinned.querySelector('.md');
  if (body && typeof p.text === 'string' && p.text !== '') {
    if (pinned.classList.contains('agent')) {
      body.innerHTML = renderAgentMarkdown(p.text);
    } else if (pinned.classList.contains('thought')) {
      body.innerHTML = renderMarkdown(p.text);
    }
  }
  item.appendChild(meta);
  item.appendChild(holder);
  // Tap → same full-screen view-only reader as in chat
  item.addEventListener('click', () => {
    openReader(holder.querySelector('.msg') || holder);
  });
  return item;
}
function pinsEmpty(text) {
  const empty = document.createElement('div');
  empty.className = 'pins-empty';
  empty.textContent = text;
  pinsBody.appendChild(empty);
}
const pinsTitle = document.getElementById('pins-title');
const pinsBack = document.getElementById('pins-back');
let pinsBackFn = null;

function setPinsView(title, backFn) {
  pinsTitle.textContent = title;
  pinsBackFn = backFn;
  pinsBack.style.display = backFn ? '' : 'none';
  pinsBody.scrollTop = 0;
}
// One convo's pins. backFn non-null when reached from the global list.
function renderPinsFor(key, title, backFn) {
  let pins;
  try { pins = JSON.parse(localStorage.getItem(key)) || []; }
  catch { pins = []; }
  setPinsView(title, backFn);
  pinsBody.innerHTML = '';
  if (!pins.length) {
    pinsEmpty('Nothing pinned yet — hold a message and tap "Pin message".');
    return;
  }
  const rerender = () => renderPinsFor(key, title, backFn);
  for (const p of pins) pinsBody.appendChild(buildPinItem(p, key, rerender));
}
function renderPins() { renderPinsFor(pinsKey(), 'Pinned', null); }
// Global view (Sessions screen): one card per convo, tap → its pins
function renderAllPins() {
  setPinsView('Pinned', null);
  pinsBody.innerHTML = '';
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.indexOf('pins:') === 0) keys.push(k);
  }
  const groups = [];
  for (const k of keys) {
    let pins;
    try { pins = JSON.parse(localStorage.getItem(k)) || []; }
    catch { continue; }
    if (!pins.length) continue;
    const name = k.slice(5);
    const s = lastSessions.find(x => x.bufferName === name) || {};
    groups.push({ key: k, title: s.label || name, pins });
  }
  if (!groups.length) {
    pinsEmpty('Nothing pinned yet — hold a message in a chat and tap "Pin message".');
    return;
  }
  // Freshest chat first, like the session list
  groups.sort((a, b) => b.pins[b.pins.length - 1].ts - a.pins[a.pins.length - 1].ts);
  for (const g of groups) {
    const latest = g.pins[g.pins.length - 1];
    const card = document.createElement('div');
    card.className = 'pin-chat-card';
    const name = document.createElement('div');
    name.className = 'pc-name';
    name.textContent = g.title;
    const preview = document.createElement('div');
    preview.className = 'pc-preview';
    preview.textContent = latest.text.slice(0, 120);
    const meta = document.createElement('div');
    meta.className = 'pc-meta';
    meta.textContent = g.pins.length + (g.pins.length === 1 ? ' pin · ' : ' pins · ') +
      new Date(latest.ts).toLocaleDateString();
    card.appendChild(name);
    card.appendChild(preview);
    card.appendChild(meta);
    card.addEventListener('click', () =>
      renderPinsFor(g.key, g.title, renderAllPins));
    pinsBody.appendChild(card);
  }
}
// --- History: browse agent-recall transcripts ---
const historyEl = document.getElementById('history');
const historyBody = document.getElementById('history-body');
const historyTitle = document.getElementById('history-title');
const historyBackBtn = document.getElementById('history-back');
const historyDock = document.getElementById('history-dock');
const historySearchForm = document.getElementById('history-search-form');
const historySearchInput = document.getElementById('history-search-input');
let historyBackFn = null;
let historyRequestSerial = 0;
let historyRootState = {
  mode: 'recent', query: '', list: null, truncated: false, scrollTop: 0
};

function syncHistoryDock() {
  const hidden = orreryEl.classList.contains('hidden') ||
    pinsEl.classList.contains('visible') || spSheet.classList.contains('visible') ||
    pvSheet.classList.contains('visible');
  historyDock.classList.toggle('visible', !hidden);
}

function setHistoryView(title, backFn, resetScroll = true) {
  historyTitle.textContent = title;
  historyBackFn = backFn;
  historyBackBtn.style.display = backFn ? '' : 'none';
  if (resetScroll) historyBody.scrollTop = 0;
}

// "2026-08-23-16-18-27" -> "Aug 23 16:18"
function fmtHistTs(ts) {
  const p = (ts || '').split('-');
  if (p.length < 5) return ts || '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const m = months[parseInt(p[1], 10) - 1] || p[1];
  const d = new Date();
  const year = p[0] === String(d.getFullYear()) ? '' : ' ' + p[0];
  return m + ' ' + parseInt(p[2], 10) + year + ' ' + p[3] + ':' + p[4];
}

function agentBadge(agent) {
  const a = (agent || '?').toLowerCase();
  const cls = a === 'claude' ? 'claude' : a === 'codex' ? 'codex' : 'other';
  return '<span class="hc-agent ' + cls + '">' + escHtml(agent || '?') + '</span>';
}

function renderHistoryRoot() {
  setHistoryView('History', null);
  const list = historyRootState.list;
  historyBody.innerHTML = '';
  if (!list || !list.length) {
    historyBody.innerHTML = '<div class="hist-empty">' +
      (historyRootState.mode === 'search' ? 'No matching conversations.' : 'No transcripts indexed yet.') +
      '</div>';
    return;
  }
  for (const t of list) {
    const card = document.createElement('div');
    card.className = 'hist-card';
    const name = t.label || t.preview || '(empty)';
    const detail = historyRootState.mode === 'search'
      ? (t.snippet || (t.label ? t.preview : ''))
      : (t.label ? t.preview : '');
    const count = t.matchCount
      ? ' &middot; ' + t.matchCount + (t.matchCount === 1 ? ' match' : ' matches') : '';
    card.innerHTML =
      '<div class="hc-title">' + providerIcon(t.agent) +
        '<div class="hc-name">' + escHtml(name) + '</div>' +
      '</div>' +
      (detail && detail !== name
        ? '<div class="hc-snippet">' + escHtml(detail) + '</div>' : '') +
      '<div class="hc-meta">' + agentBadge(t.agent) + ' &middot; ' +
        escHtml(t.project) + ' &middot; ' + escHtml(fmtHistTs(t.timestamp)) + count + '</div>';
    card.addEventListener('click', () => {
      historyRootState.scrollTop = historyBody.scrollTop;
      openTranscript(t, historyRootState.query);
    });
    historyBody.appendChild(card);
  }
  if (historyRootState.truncated) {
    const note = document.createElement('div');
    note.className = 'hist-note';
    note.textContent = 'showing the first 40 conversations';
    historyBody.appendChild(note);
  }
  const restore = historyRootState.scrollTop;
  requestAnimationFrame(() => { historyBody.scrollTop = restore; });
}

async function loadHistory(clearQuery = false) {
  const serial = ++historyRequestSerial;
  if (clearQuery) historySearchInput.value = '';
  historyRootState = { mode: 'recent', query: '', list: null, truncated: false, scrollTop: 0 };
  setHistoryView('History', null);
  historyBody.innerHTML = '<div class="hist-empty">loading…</div>';
  let list;
  try {
    const resp = await fetch(basePath + '/api/transcripts', { method: 'POST' });
    if (!resp.ok) throw new Error(await resp.text());
    list = await resp.json();
  } catch (err) {
    if (serial !== historyRequestSerial) return;
    historyBody.innerHTML = '<div class="hist-empty">history failed: ' + escHtml(err.message) + '</div>';
    return;
  }
  if (serial !== historyRequestSerial) return;
  historyRootState.list = list || [];
  renderHistoryRoot();
}

async function searchHistory(query) {
  const serial = ++historyRequestSerial;
  historyRootState = { mode: 'search', query, list: null, truncated: false, scrollTop: 0 };
  setHistoryView('History', null);
  historyBody.innerHTML = '<div class="hist-empty">searching…</div>';
  let payload;
  try {
    const resp = await fetch(basePath + '/api/transcript-search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query})
    });
    if (!resp.ok) throw new Error(await resp.text());
    payload = await resp.json();
  } catch (err) {
    if (serial !== historyRequestSerial) return;
    historyBody.innerHTML = '<div class="hist-empty">search failed: ' + escHtml(err.message) + '</div>';
    return;
  }
  if (serial !== historyRequestSerial) return;
  historyRootState.list = payload.results || [];
  historyRootState.truncated = !!payload.truncated;
  renderHistoryRoot();
}

// Split a transcript's markdown into role sections.  Tool-call blocks
// (###) stay inside the owning agent section; the file header (before
// the first ---) is dropped.
function parseTranscript(md) {
  const lines = md.split('\n');
  const sections = [];
  let current = null;
  const finish = (endLine) => {
    if (!current) return;
    const text = current.lines.join('\n').trim();
    if (text && current.role !== "Agent's Thoughts") {
      sections.push({
        role: current.role === 'User' ? 'user' : 'agent',
        text,
        sourceStart: current.headingLine + 1,
        sourceEnd: endLine
      });
    }
  };
  for (let index = 0; index < lines.length; index++) {
    const line = lines[index].replace(/\r$/, '');
    const heading = line.match(/^## (User|Agent|Agent's Thoughts) \(([^)]*)\)\s*$/);
    if (heading) {
      finish(index);
      current = {role: heading[1], headingLine: index + 1, lines: []};
    } else if (current) {
      current.lines.push(lines[index]);
    }
  }
  finish(lines.length);
  return sections;
}

function highlightHistoryMatch(root, query) {
  const needle = (query || '').toLocaleLowerCase();
  if (!needle) return false;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  let found = false;
  for (const node of nodes) {
    const text = node.nodeValue || '';
    const lower = text.toLocaleLowerCase();
    let at = lower.indexOf(needle);
    if (at < 0) continue;
    const fragment = document.createDocumentFragment();
    let cursor = 0;
    while (at >= 0) {
      fragment.appendChild(document.createTextNode(text.slice(cursor, at)));
      const mark = document.createElement('mark');
      mark.textContent = text.slice(at, at + needle.length);
      fragment.appendChild(mark);
      cursor = at + needle.length;
      at = lower.indexOf(needle, cursor);
    }
    fragment.appendChild(document.createTextNode(text.slice(cursor)));
    node.replaceWith(fragment);
    found = true;
  }
  return found;
}

async function openTranscript(t, query = '') {
  const serial = ++historyRequestSerial;
  const listView = () => {
    ++historyRequestSerial;
    renderHistoryRoot();
  };
  setHistoryView((t.agent || '?') + ' · ' + t.project + ' · ' + fmtHistTs(t.timestamp), listView);
  historyBody.innerHTML = '<div class="hist-empty">loading…</div>';
  let content;
  try {
    const resp = await fetch(basePath + '/api/transcript?file=' + encodeURIComponent(t.file), { method: 'POST' });
    if (!resp.ok) throw new Error(await resp.text());
    content = (await resp.json()).content;
  } catch (err) {
    if (serial !== historyRequestSerial) return;
    historyBody.innerHTML = '<div class="hist-empty">transcript failed: ' + escHtml(err.message) + '</div>';
    return;
  }
  if (serial !== historyRequestSerial) return;
  const sections = parseTranscript(content);
  historyBody.innerHTML = '';
  const CAP = 200;
  const needle = query.toLocaleLowerCase();
  const matchLine = Number(t.matchLine) || 0;
  const lineMatchIndex = matchLine
    ? sections.findIndex(section => matchLine >= section.sourceStart && matchLine <= section.sourceEnd)
    : -1;
  const textMatchIndex = needle
    ? sections.findIndex(section => section.text.toLocaleLowerCase().includes(needle)) : -1;
  const matchIndex = lineMatchIndex >= 0 ? lineMatchIndex : textMatchIndex;
  let start = Math.max(0, sections.length - CAP);
  let end = sections.length;
  if (matchIndex >= 0) {
    start = Math.max(0, matchIndex - 25);
    end = Math.min(sections.length, matchIndex + 26);
  }
  if (start > 0 || end < sections.length) {
    const note = document.createElement('div');
    note.className = 'hist-note';
    note.textContent = matchIndex >= 0
      ? 'showing messages ' + (start + 1) + '–' + end + ' of ' + sections.length + ' around match'
      : 'showing last ' + (end - start) + ' of ' + sections.length + ' messages';
    historyBody.appendChild(note);
  }
  let matchedBubble = null;
  for (let index = start; index < end; index++) {
    const s = sections[index];
    const d = document.createElement('div');
    d.className = 'pv-msg ' + s.role;
    if (s.role === 'agent') d.innerHTML = '<div class="md">' + renderAgentMarkdown(s.text) + '</div>';
    else d.textContent = s.text;
    if (index === matchIndex) {
      highlightHistoryMatch(d, query);
      d.classList.add('hist-match');
      matchedBubble = d;
    }
    historyBody.appendChild(d);
  }
  if (!sections.length) historyBody.innerHTML = '<div class="hist-empty">(empty transcript)</div>';
  if (matchedBubble) requestAnimationFrame(() => matchedBubble.scrollIntoView({block: 'center'}));
}

document.getElementById('nav-history-btn').addEventListener('click', () => {
  historyEl.classList.add('visible');
  historySearchInput.blur();
  loadHistory(true);
});
historySearchInput.addEventListener('focus', () => {
  if (!historyEl.classList.contains('visible')) {
    historyEl.classList.add('visible');
    if (historyRootState.list === null) loadHistory();
    else renderHistoryRoot();
  }
});
historySearchForm.addEventListener('submit', (e) => {
  e.preventDefault();
  historyEl.classList.add('visible');
  const query = historySearchInput.value.trim();
  if (!query) {
    loadHistory();
    return;
  }
  if ([...query].length < 2) {
    ++historyRequestSerial;
    setHistoryView('History', null);
    historyBody.innerHTML = '<div class="hist-empty">Type at least 2 characters.</div>';
    return;
  }
  searchHistory(query);
});
historySearchInput.addEventListener('search', () => {
  if (!historySearchInput.value.trim() && historyEl.classList.contains('visible')) loadHistory();
});
historyBackBtn.addEventListener('click', () => { if (historyBackFn) historyBackFn(); });
document.getElementById('history-close').addEventListener('click', () => {
  ++historyRequestSerial;
  historyEl.classList.remove('visible');
  historySearchInput.blur();
});

document.getElementById('nav-pins-btn').addEventListener('click', () => {
  renderAllPins();
  pinsEl.classList.add('visible');
  syncHistoryDock();
});
pinsBack.addEventListener('click', () => { if (pinsBackFn) pinsBackFn(); });
document.getElementById('pins-close').addEventListener('click', () => {
  pinsEl.classList.remove('visible');
  syncHistoryDock();
});
mmPin.addEventListener('click', () => {
  if (mmTarget) togglePin(mmTarget);
  closeMsgMenu();
});
document.getElementById('reader-close').addEventListener('click', closeReader);
// Reader-only text size: A−/A+ nudge a CSS var scoped to the reader,
// clamped 15–31px, remembered across sessions.  Chat text never moves.
let readerFs = parseInt(localStorage.getItem('readerFs'), 10) || 19;
function applyReaderFs() {
  readerBody.style.setProperty('--reader-fs', readerFs + 'px');
  localStorage.setItem('readerFs', String(readerFs));
}
applyReaderFs();
document.getElementById('reader-smaller').addEventListener('click', () => {
  readerFs = Math.max(15, readerFs - 2); applyReaderFs();
});
document.getElementById('reader-bigger').addEventListener('click', () => {
  readerFs = Math.min(31, readerFs + 2); applyReaderFs();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (readerEl.classList.contains('visible')) closeReader();
  else if (msgMenu.classList.contains('visible')) closeMsgMenu();
  else if (chatMenu.classList.contains('visible')) closeChatMenu();
  else if (pinsEl.classList.contains('visible')) {
    pinsEl.classList.remove('visible');
    syncHistoryDock();
  }
  else if (historyEl.classList.contains('visible')) {
    if (historyBackFn) historyBackFn(); else historyEl.classList.remove('visible');
  }
});

// Start: try loading sessions (discover mode), fall back to direct connect.
// ?session=<bufferName> (a push tap with no window open) lands on that chat.
loadSessions().then(async () => {
  const wanted = new URLSearchParams(location.search).get('session');
  if (wanted) await openSessionByName(wanted);
  consumePendingSession();
});
