function addPermissionMsg(msg, interactive) {
  const params = msg.params || {};
  const tc = params.toolCall || {};
  const options = params.options || [];

  const d = document.createElement('div');
  d.className = 'msg permission' + (interactive ? '' : ' resolved');
  d.id = 'msg-' + (++msgIdCounter);

  // Icon based on tool kind
  const KIND_ICONS = {
    read: '\uD83D\uDCD6', edit: '\u270F\uFE0F', delete: '\uD83D\uDDD1',
    execute: '\uD83D\uDCBB', search: '\uD83D\uDD0D', fetch: '\uD83C\uDF10',
    switch_mode: '\uD83D\uDCCB'
  };
  const icon = KIND_ICONS[tc.kind] || '\uD83D\uDD12';

  // Extract path from content or locations
  let filePath = '';
  if (tc.content && tc.content.length > 0) {
    filePath = tc.content[0].path || '';
  }
  if (!filePath && tc.locations && tc.locations.length > 0) {
    filePath = tc.locations[0].path || '';
  }

  let headerHtml =
    '<div class="perm-header">' +
      '<span class="perm-icon">' + icon + '</span>' +
      '<div class="perm-info">' +
        '<div class="perm-title">' + escHtml(tc.title || 'Permission required') + '</div>' +
        (filePath ? '<div class="perm-path">' + escHtml(shortPath(filePath)) + '</div>' : '') +
      '</div>' +
    '</div>';

  // Detail: show diff or text content
  let detailHtml = '';
  // ExitPlanMode: show the plan text from rawInput.plan
  if (tc.kind === 'switch_mode' && tc.rawInput && tc.rawInput.plan) {
    detailHtml = '<div class="perm-detail md">' + renderMarkdown(tc.rawInput.plan) + '</div>';
  } else if (tc.content && tc.content.length > 0) {
    const c = tc.content[0];
    if (c.type === 'diff' && c.oldText !== undefined) {
      detailHtml = '<div class="perm-detail">' + renderDiff(c.oldText, c.newText || '') + '</div>';
    } else if (c.type === 'text' && c.text) {
      const preview = c.text.length > 1000 ? c.text.slice(0, 1000) + '\n... (truncated)' : c.text;
      detailHtml = '<div class="perm-detail">' + escHtml(preview) + '</div>';
    } else if (c.type === 'terminal' && c.command) {
      detailHtml = '<div class="perm-detail">$ ' + escHtml(c.command) + '</div>';
    }
  }

  // Option buttons
  let optionsHtml = '';
  if (interactive && options.length > 0) {
    optionsHtml = '<div class="perm-options">';
    for (const opt of options) {
      let cls = 'perm-btn';
      if (opt.kind === 'allow_once') cls += ' allow';
      else if (opt.kind === 'allow_always') cls += ' allow-always';
      else if (opt.kind === 'reject_once') cls += ' reject';
      else if (opt.kind === 'reject_always') cls += ' reject-always';
      optionsHtml += '<button class="' + cls + '" data-option-id="' + escHtml(opt.optionId) + '">' +
        escHtml(opt.name) + '</button>';
    }
    optionsHtml += '</div>';
  }

  d.innerHTML = headerHtml + detailHtml + optionsHtml;

  if (interactive) {
    const buttons = d.querySelectorAll('.perm-btn');
    buttons.forEach(btn => {
      btn.onclick = () => {
        // A card left on screen through a reconnect is stale; the replay
        // renders the live request again with fresh buttons.
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const optionId = btn.getAttribute('data-option-id');
        // Send response
        ws.send(JSON.stringify({
          jsonrpc: '2.0', id: msg.id,
          result: { outcome: { outcome: 'selected', optionId: optionId } }
        }));
        // Disable all buttons, highlight selected
        buttons.forEach(b => { b.disabled = true; });
        btn.classList.add('selected');
        d.classList.add('resolved');
        // Remove from pending
        pendingPermissions = pendingPermissions.filter(p => p.id !== msg.id);
      };
    });
    pendingPermissions.push({ id: msg.id, element: d });
  }

  messagesEl.appendChild(d);
  if (isAtBottom) scrollToBottom();
  return d;
}

// Add approve/reject buttons to a pending ExitPlanMode tool card.
// The card already shows the plan text; this adds interactive buttons.
function addPlanApprovalButtons(toolEl) {
  const btns = document.createElement('div');
  btns.className = 'perm-options';
  btns.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:0 12px 12px';

  const approveBtn = document.createElement('button');
  approveBtn.className = 'perm-btn allow';
  approveBtn.textContent = 'Approve';
  approveBtn.style.cssText = 'border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;background:#238636;color:#fff';

  const rejectBtn = document.createElement('button');
  rejectBtn.className = 'perm-btn reject';
  rejectBtn.textContent = 'Reject';
  rejectBtn.style.cssText = 'border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;background:#8b2020;color:#fff';

  function respond(approved) {
    // Check if there's a pending permission we can respond to
    const pending = pendingPermissions.find(p => true); // any pending permission
    if (pending) {
      const optionId = approved ? 'default' : (pending.element ? 'reject' : 'default');
      ws.send(JSON.stringify({
        jsonrpc: '2.0', id: pending.id,
        result: { outcome: { outcome: 'selected', optionId: approved ? 'default' : 'reject' } }
      }));
      pendingPermissions = pendingPermissions.filter(p2 => p2.id !== pending.id);
    } else {
      // No pending permission — send as a prompt
      if (sessionId && ws && ws.readyState === 1) {
        sendPromptRequest([{ type: 'text', text: approved ? 'Yes, proceed with the plan.' : 'No, reject the plan.' }]);
        setProcessing(true);
      }
    }
    approveBtn.disabled = true;
    rejectBtn.disabled = true;
    (approved ? approveBtn : rejectBtn).style.outline = '2px solid #fff';
    (approved ? approveBtn : rejectBtn).style.outlineOffset = '1px';
    toolEl.classList.add('resolved');
  }

  approveBtn.onclick = (e) => { e.stopPropagation(); respond(true); };
  rejectBtn.onclick = (e) => { e.stopPropagation(); respond(false); };

  btns.appendChild(approveBtn);
  btns.appendChild(rejectBtn);

  // Make card expanded by default so plan text and buttons are visible
  toolEl.classList.add('expanded');
  toolEl.appendChild(btns);
}

function copyText(text) {
  // navigator.clipboard only exists in a secure context (HTTPS/localhost).
  // The phone reaches this over plain HTTP, where it's undefined — fall back
  // to a temporary textarea + execCommand (the iOS-safe Range selection dance).
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text)
      .then(() => { showToast('Copied to clipboard'); return true; })
      .catch(() => legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}

function legacyCopy(text) {
  // clipboard.js's proven iOS technique: a readonly textarea kept off-screen
  // (12pt to block iOS zoom, positioned at the current scroll offset so
  // focusing it doesn't jump the page), select its value, then execCommand.
  const yOffset = window.pageYOffset || document.documentElement.scrollTop || 0;
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'font-size:12pt;border:0;padding:0;margin:0;position:absolute;left:-9999px;';
  ta.style.top = yOffset + 'px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  showToast(ok ? 'Copied to clipboard' : 'Copy failed — long-press to select');
  return ok;
}

document.addEventListener('click', (e) => {
  const target = e.target instanceof Element ? e.target : e.target.parentElement;
  const sentImage = target && target.closest('.sent-images img');
  if (sentImage && messagesEl.contains(sentImage)) {
    e.preventDefault();
    e.stopPropagation();
    openReader(sentImage.closest('.msg'));
    return;
  }
  const copy = target && target.closest('.code-copy');
  if (copy) {
    e.preventDefault();
    e.stopPropagation();
    // New blocks keep the header outside the scrolling <pre>.
    // parentElement fallback keeps copy working for old pinned HTML.
    const block = copy.closest('.code-block') || copy.parentElement;
    const code = block && block.querySelector('code');
    if (!code) return;
    Promise.resolve(copyText(code.textContent)).then((ok) => {
      if (!ok) return;
      copy.classList.add('copied');
      copy.setAttribute('aria-label', 'Copied');
      clearTimeout(copy._resetTimer);
      copy._resetTimer = setTimeout(() => {
        copy.classList.remove('copied');
        copy.setAttribute('aria-label', 'Copy code');
      }, 900);
    });
    return;
  }
  const pill = target && target.closest('.ref-pill');
  if (pill) {
    e.preventDefault();
    e.stopPropagation();
    const detail = pill.parentElement.querySelector('.sent-ref-detail');
    const expanded = pill.getAttribute('aria-expanded') === 'true';
    pill.setAttribute('aria-expanded', expanded ? 'false' : 'true');
    detail.hidden = expanded;
  }
});

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('visible'), 1500);
}

function toolCopyText(el) {
  const name = el.querySelector('.tool-name');
  const path = el.querySelector('.tool-path');
  const body = el.querySelector('.tool-body');
  let parts = [];
  if (name) parts.push(name.textContent);
  if (path) parts.push(path.textContent);
  if (body && body.textContent.trim()) parts.push(body.textContent.trim());
  return parts.join('\n');
}

function scrollToBottom(smooth) {
  if (smooth) {
    messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    return;
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
  scrollBtn.classList.remove('visible');
  isAtBottom = true;
}

messagesEl.addEventListener('scroll', () => {
  const dist = messagesEl.scrollHeight - messagesEl.clientHeight - messagesEl.scrollTop;
  isAtBottom = dist < 60;
  scrollBtn.classList.toggle('visible', !isAtBottom);
});

// A replay lands as one paint, but the content keeps growing for a beat
// afterwards: the Iosevka swap, images and tall code blocks all add
// height after the first layout. One scrollTop assignment therefore
// lands short, the bottom drifts away, and the scroll button pops while
// the view sits above the true end. Hold the bottom until the content
// stops moving (or the user scrolls up), with instant jumps only.
let settleObserver = null;
let settleTimer = null;
function pinBottomWhileSettling(ms = 1500) {
  if (settleObserver) settleObserver.disconnect();
  clearTimeout(settleTimer);
  scrollToBottom();
  const pin = () => { if (isAtBottom) scrollToBottom(); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(pin);
  if (typeof ResizeObserver !== 'undefined') {
    settleObserver = new ResizeObserver(pin);
    for (const el of messagesEl.children) settleObserver.observe(el);
  }
  settleTimer = setTimeout(() => {
    if (settleObserver) settleObserver.disconnect();
    settleObserver = null;
    settleTimer = null;
    pin();
  }, ms);
}

// Terminal-style braille spinner (the rig is a terminal; so is this)
const SPINNER_FRAMES = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
let spinnerTimer = null, spinnerIdx = 0;
const spinnerGlyph = document.getElementById('spinner-glyph');

function setProcessing(v) {
  processing = v;
  const wasAtBottom = isAtBottom;
  thinkingEl.classList.toggle('visible', v);
  // The bar takes its height from the message list; without a re-snap the
  // bubble that was just sent loses its bottom edge behind it.
  if (v && wasAtBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  sendBtn.style.display = v ? 'none' : '';
  stopBtn.style.display = v ? 'flex' : 'none';
  if (v && !spinnerTimer) {
    spinnerTimer = setInterval(() => {
      spinnerIdx = (spinnerIdx + 1) % SPINNER_FRAMES.length;
      spinnerGlyph.textContent = SPINNER_FRAMES[spinnerIdx];
    }, 80);
  } else if (!v && spinnerTimer) {
    clearInterval(spinnerTimer); spinnerTimer = null;
  }
}

function updateModeBtn() {
  const label = modeName(currentMode);
  const color = modeColor(currentMode);
  modeBtn.textContent = label;
  modeBtn.style.color = color;
  modeBtn.style.borderColor = color;
}

function cycleMode() {
  if (!sessionId || availableModes.length === 0) return;
  const ids = availableModes.map(m => m.id);
  const idx = ids.indexOf(currentMode);
  const nextMode = ids[(idx + 1) % ids.length];
  // Optimistic update
  currentMode = nextMode;
  updateModeBtn();
  // Send to agent
  ws.send(JSON.stringify({
    jsonrpc: '2.0', id: nextId++,
    method: 'session/set_mode',
    params: { sessionId, modeId: nextMode }
  }));
}

// --- WebSocket & ACP protocol ---
// --- Socket: connect, reconnect, keepalive ---
// (index_test.mjs extracts this block into a vm; keep the end marker.)

// The one DOM wipe for the chat. On a same-session reconnect it runs at
// the top of flushReplay, one synchronous paint before the replacement
// renders, so the old transcript never leaves the screen early.
function clearMessages() {
  messagesEl.classList.remove('reconnecting');
  messagesEl.innerHTML = '';
  messagesEl._toolCalls = {};
  messagesEl._lastTool = null;
  allReplayTurns = [];
  renderedTurnStart = 0;
}

function connect(pid) {
  resetThoughtState();
  currentUserMsg = null;
  replayMode = true;
  resetReplayBuffer();
  clearTimeout(replayTimer);
  replayTimer = null;

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let url = proto + '//' + location.host + basePath + '/ws';
  if (pid) url += '?sock=' + pid;

  // One live socket at a time. If a previous dial is still connecting or
  // open, drop it silently so two sockets never share the handlers,
  // the replay buffer, or the silence timer.
  if (ws && ws.readyState !== WebSocket.CLOSING && ws.readyState !== WebSocket.CLOSED) {
    ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null;
    ws.close();
  }
  ws = new WebSocket(url);

  ws.onopen = () => {
    statusText.textContent = 'Connected';
    statusText.className = 'header-status connected';
    reconnectAttempts = 0;
    waitForSessionAttempts = 0;
    disconnectedAt = null;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    noteAlive(); // an open socket that never speaks is dead too
  };

  ws.onmessage = (e) => {
    noteAlive();
    const msg = JSON.parse(e.data);
    // The server's keepalive. Never enters the replay buffer or
    // handleMessage; its only job was to feed the silence timer above.
    if (msg.method === 'acp-mobile/ping') return;
    if (handleSocketFrame(msg)) return;
    if (replayMode) {
      bufferReplayMessage(msg);
      clearTimeout(replayTimer);
      replayTimer = setTimeout(flushReplay, 80);
    } else {
      handleMessage(msg);
    }
  };

  ws.onclose = () => {
    // Grace state: a drop that heals in a beat reads as busy, not dead.
    // scheduleReconnect promotes to Disconnected once retries have
    // failed for long enough.
    if (disconnectedAt === null) disconnectedAt = Date.now();
    clearSilenceTimer();
    statusText.textContent = 'Reconnecting...';
    statusText.className = 'header-status reconnecting';
    messagesEl.classList.add('reconnecting');
    sendBtn.disabled = true;
    setProcessing(false);
    if (chatViewEl && chatViewEl.classList.contains('visible')) {
      scheduleReconnect();
    }
  };

  ws.onerror = () => {
    // Deliberately silent. onclose always follows onerror and owns the
    // status line; writing "Connection error" here flashed red on every
    // blip that healed a moment later.
  };
}

// iOS often leaves readyState at OPEN on a socket the OS already killed,
// and a stalled TCP path can sit that way for a minute. The server pings
// every 25s; if nothing at all arrives for SILENCE_MS the socket is
// presumed dead and closed by hand, which drops into the normal onclose
// path (Reconnecting..., 400ms redial).
const SILENCE_MS = 60000;
function clearSilenceTimer() {
  if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
}
function noteAlive() {
  clearSilenceTimer();
  silenceTimer = setTimeout(() => {
    silenceTimer = null;
    if (ws && ws.readyState === WebSocket.OPEN) ws.close();
  }, SILENCE_MS);
}

// Redial at once when the page comes back (foreground, bfcache restore,
// network return) and the socket is known to be down. A socket iOS
// killed but still reports OPEN is the silence timer's job, not this.
function wakeSocket() {
  if (!chatViewEl || !chatViewEl.classList.contains('visible')) return;
  if (ws && ws.readyState !== WebSocket.CLOSING && ws.readyState !== WebSocket.CLOSED) return;
  // The retry callback has already fired and is awaiting the session
  // lookup; it will dial on its own. Safari fires visibilitychange,
  // pageshow and online together on resume, right in that window.
  if (reconnectInFlight) return;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  reconnectAttempts = 0;
  // Time spent frozen in the background is not time the reader watched
  // a broken header. Restart the grace clock with the attempt counter,
  // or a long background stint would flash red on every foreground.
  if (disconnectedAt !== null) disconnectedAt = Date.now();
  scheduleReconnect();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') wakeSocket();
});
window.addEventListener('pageshow', wakeSocket);
window.addEventListener('online', wakeSocket);

// Attempt 0 redials almost at once (an iOS background/foreground or a
// wifi-to-cell handoff heals in well under a second); later attempts
// back off 2s, 4s, 8s, ... capped at a minute.
function reconnectDelay(attempts) {
  if (attempts <= 0) return 400;
  return Math.min(60000, 2000 * Math.pow(2, attempts - 1));
}

// Promote the yellow grace state to red once retries have failed for
// long enough. Evaluated on every scheduled retry, so no separate timer.
const RECONNECT_GRACE_MS = 8000;
const RECONNECT_GRACE_ATTEMPTS = 3;
function promoteDisconnectedIfStale() {
  if (disconnectedAt === null) return;
  if (statusText.classList.contains('error')) return;
  const stale = Date.now() - disconnectedAt > RECONNECT_GRACE_MS ||
    reconnectAttempts >= RECONNECT_GRACE_ATTEMPTS;
  if (!stale) return;
  statusText.textContent = 'Disconnected';
  statusText.className = 'header-status error';
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  promoteDisconnectedIfStale();
  const delay = reconnectDelay(reconnectAttempts);
  reconnectAttempts++;
  reconnectTimer = setTimeout(async () => {
    reconnectTimer = null;
    reconnectInFlight = true;
    try { await redial(); } finally { reconnectInFlight = false; }
  }, delay);
}

// The body of a retry: reset per-connection state, re-resolve the
// session's socket, dial. Split out so the in-flight flag above wraps
// every exit path.
async function redial() {
  // State resets only. The DOM wipe moved into flushReplay so the
  // old transcript stays on screen until its replacement is ready.
  currentAgentMsg = null;
  currentUserMsg = null;
  lastSentMsg = null;
  resetReplayBuffer();
  clearTimeout(replayTimer);
  replayTimer = null;
  closeMsgMenu();
  closeReader();
  resetThoughtState();
  sessionId = null;
  pendingPermissions = [];
  // The rig's reload (SPC c y) respawns the client under a new pid —
  // same session id.  Re-resolve before dialing so the open chat
  // follows its session onto the new socket instead of dying with
  // the old pid.  (Observed failure this guards against: 40+ dials
  // of a dead pid — "ws: no socket for pid N" — freezing the view.)
  if (currentSessionKey && currentSessionKey.indexOf('pid:') !== 0) {
    try {
      const resp = await fetch(basePath + '/api/sessions', { method: 'POST' });
      const data = await resp.json();
      const sessions = data.sessions || [];
      const same = sessions.find(s => sKey(s) === currentSessionKey);
      if (same) {
        // Fresh socket for our session — connect eagerly, don't let
        // earlier failed attempts' backoff delay the reunion.
        if (same.pid !== currentSockPid) reconnectAttempts = 1;
        currentSockPid = same.pid;
      } else if (!sessions.some(s => s.pid === currentSockPid)) {
        // Our socket is gone and the session hasn't resurfaced yet
        // (mid-reload on the rig, or killed, or its probe timed out).
        // Dialing the dead pid just burns retries — re-check on a
        // fast fixed clock (a rig reload resurfaces in seconds; the
        // ws backoff would stretch this to minutes).
        if (waitForSessionAttempts < 10) {
          waitForSessionAttempts++;
          statusText.textContent = 'Waiting for session...';
          statusText.className = 'header-status';
          // Pin the backoff: reconnectDelay(2) is 4s, so every
          // re-check lands ~4s apart. Not an outage, so it must not
          // count toward the Disconnected promotion either.
          reconnectAttempts = 2;
          disconnectedAt = null;
          reconnectInFlight = false; // scheduleReconnect must not see us as busy
          scheduleReconnect();
          return;
        }
        // ~40s and it never came back — bail to the list, not a freeze.
        waitForSessionAttempts = 0;
        showOrrery();
        return;
      }
      waitForSessionAttempts = 0;
    } catch (err) { /* offline — fall through to the old pid */ }
  }
  if (currentSockPid) {
    connect(String(currentSockPid));
  } else {
    connect();
  }
}

// --- Socket: end ---

function toolOutputText(update) {
  if (update.rawOutput) {
    if (Array.isArray(update.rawOutput)) {
      return update.rawOutput.map(c => (c && c.text) || '').filter(Boolean).join('\n');
    }
    if (typeof update.rawOutput === 'string') return update.rawOutput;
    if (typeof update.rawOutput === 'object') {
      for (const key of ['formatted_output', 'output', 'text']) {
        const value = update.rawOutput[key];
        if (typeof value === 'string' && value) return value;
        if (value && typeof value === 'object') {
          try { return JSON.stringify(value, null, 2); } catch (_) { /* continue */ }
        }
      }
      if (update.rawOutput.result !== undefined || update.rawOutput.error !== undefined) {
        try { return JSON.stringify(update.rawOutput, null, 2); } catch (_) { /* continue */ }
      }
    }
  }
  if (Array.isArray(update.content)) {
    const texts = [];
    for (const c of update.content) {
      const inner = c.content || c;
      if (inner.text) texts.push(inner.text);
    }
    if (texts.length) return texts.join('\n');
  }
  if (typeof update.content === 'string') return update.content;
  if (update.content && update.content.text) return update.content.text;
  return '';
}

function renderTurnBatch(turns, prepend) {
  let fragment = document.createDocumentFragment();
  let lastToolEl = null;
  for (let _ti = 0; _ti < turns.length; _ti++) {
    const t = turns[_ti];
    switch (t.type) {
      case 'user': {
        fragment.appendChild(makeUserMsg('', 'sent', null, t.blocks));
        break;
      }
      case 'agent': {
        const d = document.createElement('div');
        d.className = 'msg agent';
        d.id = 'msg-' + (++msgIdCounter);
        d.innerHTML =
          '<span class="role">Agent</span>' +
          '<div class="md">' + renderAgentMarkdown(t.text) + '</div>';
        d._text = t.text;
        fragment.appendChild(d);
        break;
      }
      case 'thought':
        addThoughtMsg(t.text, t.messageId, fragment);
        break;
      case 'tool':
        lastToolEl = addToolMsgTo(fragment, t.tool);
        // Pending ExitPlanMode: show plan approval buttons (unless a permission card follows)
        if (t.tool.kind === 'switch_mode' && t.tool.rawInput &&
            t.tool.rawInput.plan &&
            t.tool.status !== 'completed' && t.tool.status !== 'failed') {
          const hasPermAfter = turns.slice(_ti + 1).some(t2 => t2.type === 'permission');
          if (!hasPermAfter) addPlanApprovalButtons(lastToolEl);
        }
        break;
      case 'permission': {
        // Append batch so far, render permission (it appends to messagesEl),
        // then start a new fragment for remaining turns
        if (prepend) {
          messagesEl.insertBefore(fragment, messagesEl.firstChild);
        } else {
          messagesEl.appendChild(fragment);
        }
        fragment = document.createDocumentFragment();
        addPermissionMsg(t.msg, t.interactive || false);
        break;
      }
      case 'error': {
        const d = document.createElement('div');
        d.className = 'msg error';
        d.innerHTML =
          '<span class="error-icon">\u26A0\uFE0F</span>' +
          '<span class="text">' + escHtml(t.text) + '</span>';
        fragment.appendChild(d);
        break;
      }
    }
  }
  if (prepend) {
    messagesEl.insertBefore(fragment, messagesEl.firstChild);
  } else {
    messagesEl.appendChild(fragment);
  }
  enforceRenderedImageMemory();
}

// Like addToolMsg but appends to a given parent (DocumentFragment).
function addToolMsgTo(parent, tool) {
  const d = makeToolMsg(tool);
  parent.appendChild(d);
  return d;
}

function showLoadMoreHint() {
  let hint = document.getElementById('load-more-hint');
  if (!hint) {
    hint = document.createElement('div');
    hint.id = 'load-more-hint';
    hint.style.cssText = 'text-align:center;padding:12px;color:var(--orange);font-size:13px;cursor:pointer';
    hint.textContent = 'Load earlier messages';
    hint.onclick = loadMoreHistory;
  }
  messagesEl.insertBefore(hint, messagesEl.firstChild);
}

function loadMoreHistory() {
  if (renderedTurnStart <= 0) return;
  const LOAD_CHUNK = 20;
  const newStart = Math.max(0, renderedTurnStart - LOAD_CHUNK);
  const batch = allReplayTurns.slice(newStart, renderedTurnStart);
  renderedTurnStart = newStart;

  // Remember scroll position to maintain view
  const prevHeight = messagesEl.scrollHeight;

  // Remove existing hint
  const hint = document.getElementById('load-more-hint');
  if (hint) hint.remove();

  renderTurnBatch(batch, true);

  // Re-add hint if there's more
  if (renderedTurnStart > 0) {
    showLoadMoreHint();
  }

  // Restore scroll position
  messagesEl.scrollTop += messagesEl.scrollHeight - prevHeight;
}

// Process all buffered replay messages at once, skipping intermediate renders.
// Assembles agent chunks into complete messages, renders once per message turn.
function flushReplay() {
  replayMode = false;
  replayTimer = null;
  const msgs = replayBuffer;
  resetReplayBuffer();

  // First pass: process responses (initialize, session/new, prompt results)
  // and collect notification sequences into assembled turns.
  const turns = []; // message turns; tool turns carry one normalized ACP tool state
  let pendingText = '';
  let pendingUserTurn = null;
  const thoughtTurnsById = new Map();
  let currentAnonymousThoughtTurn = null;
  const flushPendingAgent = () => {
    if (!pendingText) return;
    turns.push({type: 'agent', text: pendingText});
    pendingText = '';
  };
  const flushPendingUser = () => {
    if (!pendingUserTurn) return;
    turns.push(pendingUserTurn);
    pendingUserTurn = null;
  };
  // Track the *latest* turn boundary in replay order.  A historical
  // turn_complete must not make a newer, still-running turn look idle.
  // Only a user prompt opens a turn; agent or tool chunks alone (an
  // agent-initiated continuation) never make the replay look busy.
  let replayBusy = false;
  const replayActivity = () => { if (remoteTurnOpen) replayBusy = true; };
  // Replay is the whole truth about this session: prompts this phone
  // sent before a reload are in it as user chunks like everyone else's.
  localPromptIds.clear();
  remoteTurnOpen = false;

  for (const msg of msgs) {
    // Responses: handle silently for state (sessionId, modes, etc.)
    if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
      flushPendingUser();
      if (msg.error) {
        currentAnonymousThoughtTurn = null;
        flushPendingAgent();
        let errText = msg.error.message || 'Unknown error';
        if (msg.error.data && msg.error.data.details) {
          errText += ': ' + msg.error.data.details;
        }
        if (msg.error.code) {
          errText += ' [' + msg.error.code + ']';
        }
        turns.push({type: 'error', text: errText});
        continue;
      }
      if (msg.result && msg.result.agentInfo) {
        const info = msg.result.agentInfo;
        // Fallback only — once we know the buffer name, label/buffer wins.
        if (!currentBufferName) headerTitle.textContent = info.title || info.name || 'ACP';
      }
      if (msg.result && msg.result.sessionId) {
        sessionId = msg.result.sessionId;
        sendBtn.disabled = false;
        if (msg.result.cwd) projectCwd = msg.result.cwd;
        if (msg.result.modes) {
          availableModes = msg.result.modes.availableModes || [];
          currentMode = msg.result.modes.currentModeId || 'default';
          if (availableModes.length > 0) {
            modeBtn.style.display = '';
            updateModeBtn();
          }
        }
      }
      if (msg.result && msg.result.stopReason) {
        replayBusy = false; remoteTurnOpen = false;
        currentAnonymousThoughtTurn = null;
        flushPendingAgent();
      }
      continue;
    }

    // Notifications
    if (msg.method === 'acp-multiplex/meta' && msg.params && msg.params.name) {
      flushPendingUser();
      currentBufferName = msg.params.name;
      updateChatHeader();
      document.getElementById('chat-menu-btn').style.display = '';
      continue;
    }
    // Permission requests from agent (reverse calls)
    if (msg.method === 'session/request_permission' && msg.id !== undefined) {
      flushPendingUser();
      currentAnonymousThoughtTurn = null;
      flushPendingAgent();
      turns.push({type: 'permission', msg: msg});
      continue;
    }
    if (msg.method !== 'session/update' || !msg.params) {
      flushPendingUser();
      continue;
    }
    const update = msg.params.update;
    if (!update) {
      flushPendingUser();
      continue;
    }
    if (!sessionId && msg.params.sessionId) {
      sessionId = msg.params.sessionId;
      sendBtn.disabled = false;
    }

    const kind = update.sessionUpdate;
    const text = (update.content && update.content.text) || update.text || '';
    if (kind !== 'user_message_chunk') flushPendingUser();
    if (kind !== 'agent_thought_chunk') currentAnonymousThoughtTurn = null;

    switch (kind) {
      case 'agent_message_chunk':
        replayActivity();
        pendingText += text;
        break;
      case 'agent_thought_chunk': {
        const thoughtText = thoughtChunkText(update);
        if (thoughtText === null) {
          currentAnonymousThoughtTurn = null;
          break;
        }
        flushPendingAgent();
        const messageId = thoughtMessageId(update);
        let thoughtTurn;
        if (messageId) {
          currentAnonymousThoughtTurn = null;
          thoughtTurn = thoughtTurnsById.get(messageId);
          if (!thoughtTurn) {
            thoughtTurn = {type: 'thought', messageId, text: ''};
            thoughtTurnsById.set(messageId, thoughtTurn);
            turns.push(thoughtTurn);
          }
        } else {
          if (!currentAnonymousThoughtTurn) {
            currentAnonymousThoughtTurn = {type: 'thought', messageId: null, text: ''};
            turns.push(currentAnonymousThoughtTurn);
          }
          thoughtTurn = currentAnonymousThoughtTurn;
        }
        thoughtTurn.text += thoughtText;
        break;
      }
      case 'tool_call': {
        replayActivity();
        const tcId = update.toolCallId;
        // Check if we already have a turn for this toolCallId — update it instead of adding duplicate
        let found = false;
        if (tcId) {
          for (let j = turns.length - 1; j >= 0; j--) {
            if (turns[j].type === 'tool' && turns[j].toolCallId === tcId) {
              turns[j].tool = mergeToolUpdate(turns[j].tool, update);
              found = true;
              break;
            }
          }
        }
        if (!found) {
          flushPendingAgent();
          turns.push({type: 'tool', toolCallId: tcId, tool: mergeToolUpdate(null, update)});
        }
        break;
      }
      case 'tool_call_update': {
        replayActivity();
        // Merge into the parent tool turn instead of creating a separate turn.
        // This prevents orphaned tool_updates when the INITIAL_TURNS window
        // or load-more batches split a tool from its update.
        const tcuId = update.toolCallId;
        let merged = false;
        if (tcuId) {
          for (let j = turns.length - 1; j >= 0; j--) {
            if (turns[j].type === 'tool' && turns[j].toolCallId === tcuId) {
              turns[j].tool = mergeToolUpdate(turns[j].tool, update);
              merged = true;
              break;
            }
          }
        }
        if (!merged) {
          // Fallback: no matching initial call survived the replay window.
          turns.push({type: 'tool', toolCallId: tcuId,
            tool: mergeToolUpdate(null, update)});
        }
        break;
      }
      case 'user_message_chunk':
        replayBusy = true; remoteTurnOpen = true;
        flushPendingAgent();
        pendingUserTurn = appendUserContentBlock(
          pendingUserTurn,
          update.content || (typeof update.text === 'string'
            ? {type: 'text', text: update.text} : null));
        break;
      case 'turn_complete':
        replayBusy = false; remoteTurnOpen = false;
        break;
      case 'available_commands_update':
        replayBusy = false; // command list changed; not a turn boundary, the flag stays
        if (sessionId) sendBtn.disabled = false;
        break;
      case 'current_mode_update':
        if (update.currentModeId) {
          currentMode = update.currentModeId;
          updateModeBtn();
        }
        break;
    }
  }
  // Flush any remaining user or agent text/content.
  const replayEndsWithUser = !!pendingUserTurn;
  flushPendingUser();
  flushPendingAgent();
  limitReplayImageMemory(turns);

  // The last lifecycle marker in the ordered replay is authoritative.
  // Empty/new sessions remain idle; a trailing user prompt whose turn has
  // no turn_complete yet means the turn is still running. Trailing agent
  // or tool activity with no prompt behind it does not.
  setProcessing(replayBusy);

  // A permission is still waiting only if it ends the replay: the
  // multiplex appends the unanswered request after every cached update,
  // and moves it into history once answered. Answered ones replay as
  // resolved cards; treating them as pending made idle chats show
  // "thinking" and a Stop button.
  const lastTurn = turns[turns.length - 1];
  if (lastTurn && lastTurn.type === 'permission') {
    lastTurn.interactive = true;
    remoteTurnOpen = true;
    setProcessing(true);
  }

  // Store all turns; render only the last chunk
  const INITIAL_TURNS = 20;
  // On a same-session reconnect the previous transcript is still on
  // screen. Wipe it here, one synchronous paint before the replacement,
  // and remember where the reader was so a scrolled-up view stays put.
  // Idempotent on a cold open (messagesEl is already empty).
  const hadContent = messagesEl.children.length > 0;
  const wasAtBottom = isAtBottom;
  const prevScrollTop = messagesEl.scrollTop;
  clearMessages();
  allReplayTurns = turns;
  renderedTurnStart = Math.max(0, turns.length - INITIAL_TURNS);
  const renderTurns = turns.slice(renderedTurnStart);

  renderTurnBatch(renderTurns, false);

  // If replay ends mid-way through an anonymous thought, let the first live
  // chunk continue the row that was just rendered. Any intervening replay
  // boundary clears currentAnonymousThoughtTurn above.
  currentAnonymousThought = null;
  if (currentAnonymousThoughtTurn) {
    const replayTail = messagesEl.lastElementChild;
    if (replayTail && replayTail.classList.contains('thought') &&
        !replayTail.dataset.messageId) {
      currentAnonymousThought = replayTail;
    }
  }

  currentUserMsg = null;
  if (replayEndsWithUser) {
    const replayTail = messagesEl.lastElementChild;
    if (replayTail && replayTail.classList.contains('user')) {
      currentUserMsg = replayTail;
    }
  }

  // Show "load more" hint if there's older history
  if (renderedTurnStart > 0) {
    showLoadMoreHint();
  }

  if (hadContent && !wasAtBottom) {
    // Reconnect while reading history: put the view back where it was
    // instead of yanking it to the bottom.
    messagesEl.scrollTop = prevScrollTop;
  } else {
    pinBottomWhileSettling();
  }
}

function handleMessage(msg) {
  const isUserMessageChunk = msg.method === 'session/update' && msg.params &&
    msg.params.update && msg.params.update.sessionUpdate === 'user_message_chunk';
  if (!isUserMessageChunk) currentUserMsg = null;

  // Response
  if (msg.id !== undefined && (msg.result !== undefined || msg.error !== undefined)) {
    if (msg.error) {
      endAnonymousThoughtRun();
      let errText = msg.error.message || 'Unknown error';
      if (msg.error.data && msg.error.data.details) {
        errText += ': ' + msg.error.data.details;
      }
      if (msg.error.code) {
        errText += ' [' + msg.error.code + ']';
      }
      addErrorMsg(errText);
      // Only a prompt's own failure ends its turn; a failed set_mode does not.
      localPromptIds.delete(msg.id);
      if (!promptTurnOpen()) setProcessing(false);
      return;
    }

    if (msg.result && msg.result.agentInfo) {
      const info = msg.result.agentInfo;
      // Fallback only — once we know the buffer name, label/buffer wins.
      if (!currentBufferName) headerTitle.textContent = info.title || info.name || 'ACP';
    }

    if (msg.result && msg.result.sessionId) {
      sessionId = msg.result.sessionId;
      sendBtn.disabled = false;
      // Extract cwd and modes from session/new response
      if (msg.result.cwd) {
        projectCwd = msg.result.cwd;
      }
      if (msg.result.modes) {
        availableModes = msg.result.modes.availableModes || [];
        currentMode = msg.result.modes.currentModeId || 'default';
        if (availableModes.length > 0) {
          modeBtn.style.display = '';
          updateModeBtn();
        }
      }
    }

    if (msg.result && msg.result.stopReason) {
      currentAgentMsg = null;
      endAnonymousThoughtRun();
      localPromptIds.delete(msg.id);
      if (!promptTurnOpen()) setProcessing(false);
      // Mark last sent user message as delivered
      if (lastSentMsg) { markSent(lastSentMsg); lastSentMsg = null; }
      flushMessageQueue();
    }
    return;
  }

  // Buffer name from acp-multiplex
  if (msg.method === 'acp-multiplex/meta' && msg.params && msg.params.name) {
    currentBufferName = msg.params.name;
    updateChatHeader();
    document.getElementById('chat-menu-btn').style.display = '';
    return;
  }

  // Notification: session/update
  if (msg.method === 'session/update' && msg.params) {
    const update = msg.params.update;
    if (!update) return;

    if (!sessionId && msg.params.sessionId) {
      sessionId = msg.params.sessionId;
      sendBtn.disabled = false;
    }

    const kind = update.sessionUpdate;
    const text = (update.content && update.content.text) || update.text || '';
    if (kind !== 'agent_thought_chunk') endAnonymousThoughtRun();

    switch (kind) {
      case 'agent_message_chunk':
        if (promptTurnOpen()) setProcessing(true);
        if (!currentAgentMsg) {
          currentAgentMsg = addAgentMsg('');
        }
        currentAgentMsg._text += text;
        updateAgentMsg(currentAgentMsg, currentAgentMsg._text);
        break;

      case 'agent_thought_chunk': {
        const thoughtText = thoughtChunkText(update);
        if (thoughtText === null) {
          endAnonymousThoughtRun();
          break;
        }
        if (promptTurnOpen()) setProcessing(true);
        appendThoughtDelta(update, thoughtText);
        break;
      }

      case 'tool_call': {
        currentAgentMsg = null;
        if (promptTurnOpen()) setProcessing(true);
        const tcId = update.toolCallId;
        // If we already have an element for this toolCallId, update it in place
        const existing = tcId && messagesEl._toolCalls && messagesEl._toolCalls[tcId];
        if (existing) {
          updateToolMsg(existing, update);
          messagesEl._lastTool = existing;
        } else {
          const el = addToolMsg(mergeToolUpdate(null, update));
          messagesEl._lastTool = el;
          if (tcId) {
            if (!messagesEl._toolCalls) messagesEl._toolCalls = {};
            messagesEl._toolCalls[tcId] = el;
          }
        }
        break;
      }

      case 'tool_call_update': {
        const tcuId = update.toolCallId;
        const toolEl = (tcuId && messagesEl._toolCalls && messagesEl._toolCalls[tcuId]) || messagesEl._lastTool;
        if (toolEl) {
          updateToolMsg(toolEl, update);
        }
        break;
      }

      case 'user_message_chunk':
        currentAgentMsg = null;
        openRemoteTurn(); // a prompt from the rig or another phone
        setProcessing(true);
        {
          const block = normalizeUserContentBlock(
            update.content || (typeof update.text === 'string'
              ? {type: 'text', text: update.text} : null));
          if (!block) break;
          if (currentUserMsg) {
            appendUserMsgBlock(currentUserMsg, block);
            enforceRenderedImageMemory();
            if (isAtBottom) scrollToBottom();
          } else {
            currentUserMsg = addUserMsg('', 'sent', null, [block]);
          }
        }
        break;

      case 'turn_complete':
        currentAgentMsg = null;
        closeRemoteTurn();
        if (!promptTurnOpen()) setProcessing(false);
        if (lastSentMsg) { markSent(lastSentMsg); lastSentMsg = null; }
        flushMessageQueue();
        break;

      case 'available_commands_update':
        if (sessionId) sendBtn.disabled = false;
        // Command list changed. Not a turn boundary: the visible state
        // resets as before, but an open turn stays open so the next
        // chunk shows busy again.
        setProcessing(false);
        flushMessageQueue();
        break;

      case 'current_mode_update':
        if (update.currentModeId) {
          currentMode = update.currentModeId;
          updateModeBtn();
        }
        break;
    }
    return;
  }

  // Reverse call from agent
  if (msg.method === 'session/request_permission' && msg.id !== undefined) {
    currentAgentMsg = null;
    endAnonymousThoughtRun();
    openRemoteTurn(); // a permission only ever arrives inside a prompt turn
    setProcessing(true);
    addPermissionMsg(msg, true);
    return;
  }
  if (msg.method && msg.id !== undefined) {
    currentAgentMsg = null;
    endAnonymousThoughtRun();
    // Unknown reverse call — respond with error so agent doesn't hang
    ws.send(JSON.stringify({
      jsonrpc: '2.0', id: msg.id,
      error: { code: -32601, message: 'Method not supported: ' + msg.method }
    }));
    addSystemMsg('Unsupported: ' + msg.method);
  }
}

// --- User interaction ---

let lastSentMsg = null;
let messageQueue = [];

// --- Image attachments: phone photos → ACP image content blocks.
// Canvas re-encode caps dimensions and converts HEIC to JPEG, so the
// base64 payload stays reasonable over the websocket.
const attachBtn = document.getElementById('attach-btn');
const attachInput = document.getElementById('attach-input');
const attachRow = document.getElementById('attach-row');
let pendingImages = []; // {data, mimeType, thumb}
let pendingRefs = [];   // selected quote strings
let activeSelectionText = '';
let selectionHideTimer = null;
let suppressImagePickerUntil = 0;

function renderAttachRow() {
  attachRow.innerHTML = '';
  attachRow.classList.toggle('has-items', pendingImages.length > 0 || pendingRefs.length > 0);
  pendingRefs.forEach((ref, i) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip ref-chip';
    const icon = document.createElement('span');
    icon.textContent = '\u275D';
    const label = document.createElement('span');
    label.className = 'ref-chip-text';
    label.textContent = refSnippet(ref, 38) || 'referenced context';
    label.title = ref;
    const x = document.createElement('button');
    x.className = 'chip-x';
    x.type = 'button';
    x.setAttribute('aria-label', 'Remove referenced context');
    x.textContent = '\u00d7';
    x.onclick = () => { pendingRefs.splice(i, 1); renderAttachRow(); };
    chip.append(icon, label, x);
    attachRow.appendChild(chip);
  });
  pendingImages.forEach((img, i) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    const im = document.createElement('img');
    im.src = img.thumb;
    const x = document.createElement('button');
    x.className = 'chip-x';
    x.textContent = '\u00d7';
    x.onclick = () => { pendingImages.splice(i, 1); renderAttachRow(); };
    chip.appendChild(im); chip.appendChild(x);
    attachRow.appendChild(chip);
  });
}

function selectionMessage(node) {
  const el = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
  return el && el.closest ? el.closest('.msg') : null;
}

function setAttachButtonReferenceMode(ready) {
  attachBtn.classList.toggle('ref-ready', ready);
  attachBtn.textContent = ready ? '\u275D' : '+';
  attachBtn.setAttribute('aria-label', ready ? 'Attach selected text' : 'Attach image');
}

function clearSelectionCapture() {
  activeSelectionText = '';
  setAttachButtonReferenceMode(false);
}

function refreshSelectionCapture() {
  const selection = window.getSelection();
  const startMsg = selection && selectionMessage(selection.anchorNode);
  const endMsg = selection && selectionMessage(selection.focusNode);
  const text = selection && !selection.isCollapsed ? selection.toString() : '';
  if (text.trim() && startMsg && startMsg === endMsg && messagesEl.contains(startMsg)) {
    clearTimeout(selectionHideTimer);
    activeSelectionText = text;
    setAttachButtonReferenceMode(true);
    return;
  }
  clearTimeout(selectionHideTimer);
  selectionHideTimer = setTimeout(clearSelectionCapture, 220);
}

function attachCurrentSelection() {
  if (!activeSelectionText || !activeSelectionText.trim()) return;
  pendingRefs.push(activeSelectionText);
  activeSelectionText = '';
  clearTimeout(selectionHideTimer);
  setAttachButtonReferenceMode(false);
  const selection = window.getSelection();
  if (selection) selection.removeAllRanges();
  renderAttachRow();
  showToast('Selection attached');
  try { promptEl.focus({ preventScroll: true }); } catch (_) { promptEl.focus(); }
}

document.addEventListener('selectionchange', refreshSelectionCapture);
attachBtn.addEventListener('pointerdown', (e) => {
  if (!activeSelectionText || !activeSelectionText.trim()) return;
  // Capture on pointerdown before iOS collapses the native selection.
  // Suppress the synthetic click so it cannot open the image picker too.
  e.preventDefault();
  suppressImagePickerUntil = Date.now() + 600;
  attachCurrentSelection();
});

async function loadImageFromFile(file) {
  try {
    const bmp = await createImageBitmap(file);
    return { img: bmp, url: null, w: bmp.width, h: bmp.height };
  } catch (_) { /* fall through to <img> decode */ }
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url, w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('cannot decode ' + (file.type || 'unknown type')));
    };
    img.src = url;
  });
}

async function addAttachment(file) {
  try {
    const { img, url, w, h } = await loadImageFromFile(file);
    const MAX = 1568; // Claude vision sweet spot; bigger just burns tokens
    const scale = Math.min(1, MAX / Math.max(w, h));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    if (url) URL.revokeObjectURL(url);
    if (img.close) img.close();
    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
    pendingImages.push({
      data: dataUrl.slice(dataUrl.indexOf(',') + 1),
      mimeType: 'image/jpeg',
      thumb: dataUrl
    });
    renderAttachRow();
  } catch (err) {
    addSystemMsg('Could not read image: ' + err.message);
  }
}

attachBtn.addEventListener('click', (e) => {
  if (Date.now() < suppressImagePickerUntil) {
    e.preventDefault();
    return;
  }
  // Keyboard/assistive activation has no pointerdown; honor the cached
  // selection here as a fallback before reverting to the image picker.
  if (activeSelectionText && activeSelectionText.trim()) {
    e.preventDefault();
    attachCurrentSelection();
    return;
  }
  attachInput.click();
});
attachInput.addEventListener('change', async (e) => {
  for (const f of e.target.files) await addAttachment(f);
  attachInput.value = '';
});

// --- Composer drafts: one per chat ---
// Half-typed text belongs to the chat it was typed in. Stash it under the
// session key when leaving, restore it when that chat opens again, and
// mirror it to localStorage so a reload or a self-update keeps it.
const DRAFT_PREFIX = 'acp-draft:';
const drafts = new Map(); // session key -> text; localStorage is the mirror
function stashDraft() {
  if (!currentSessionKey) return;
  const text = promptEl.value;
  if (text) drafts.set(currentSessionKey, text); else drafts.delete(currentSessionKey);
  try {
    if (text) localStorage.setItem(DRAFT_PREFIX + currentSessionKey, text);
    else localStorage.removeItem(DRAFT_PREFIX + currentSessionKey);
  } catch (_) { /* storage full or disabled: the in-memory copy still serves this page */ }
}
function restoreDraft() {
  let text = (currentSessionKey && drafts.get(currentSessionKey)) || '';
  if (!text) {
    try { text = (currentSessionKey && localStorage.getItem(DRAFT_PREFIX + currentSessionKey)) || ''; } catch (_) {}
  }
  promptEl.value = text;
  promptEl.style.height = 'auto';
  if (text) promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px';
}

function sendPrompt() {
  const text = promptEl.value.trim();
  if ((!text && pendingImages.length === 0 && pendingRefs.length === 0) || !sessionId) return;

  const refs = pendingRefs.splice(0);
  renderAttachRow();

  promptEl.value = '';
  promptEl.style.height = 'auto';
  stashDraft(); // sent: the stored draft for this chat goes away

  if (processing) {
    // Images keep waiting in the composer; text refs belong to this queued turn.
    if (text || refs.length) {
      messageQueue.push({ text, refs });
      addUserMsg(formatReferencedPrompt(text, refs), 'queued');
    }
    if (pendingImages.length) {
      addSystemMsg('Agent is busy \u2014 attachments will send with your next message once it finishes.');
    }
    return;
  }

  sendPromptText(text, refs);
}

function sendPromptText(text, refs) {
  currentAgentMsg = null;
  const imgs = pendingImages.splice(0);
  renderAttachRow();
  const payloadText = formatReferencedPrompt(text, refs || []);
  lastSentMsg = addUserMsg(formatReferencedPrompt(text, refs || []), 'sending', imgs);
  setProcessing(true);

  const blocks = imgs.map(i => ({ type: 'image', data: i.data, mimeType: i.mimeType }));
  if (payloadText) blocks.push({ type: 'text', text: payloadText });

  sendPromptRequest(blocks);
}

function flushMessageQueue() {
  if (messageQueue.length > 0) {
    const queued = messageQueue.shift();
    const payloadText = formatReferencedPrompt(queued.text, queued.refs);
    // Message was already displayed when queued, just send it
    currentAgentMsg = null;
    setProcessing(true);
    sendPromptRequest([{ type: 'text', text: payloadText }]);
  }
}

function cancelPrompt() {
  if (!sessionId) return;
  // Cancel all pending permission requests
  for (const p of pendingPermissions) {
    ws.send(JSON.stringify({
      jsonrpc: '2.0', id: p.id,
      result: { outcome: { outcome: 'cancelled' } }
    }));
    p.element.classList.add('resolved');
    const btns = p.element.querySelectorAll('.perm-btn');
    btns.forEach(b => { b.disabled = true; });
  }
  pendingPermissions = [];
  ws.send(JSON.stringify({
    jsonrpc: '2.0',
    method: 'session/cancel',
    params: { sessionId }
  }));
  messageQueue = [];
  setProcessing(false);
  addSystemMsg('Cancelled');
}

// Phones (coarse pointer): Return types a newline, only the send button
// sends — Shift+Enter doesn't exist on a touch keyboard. Desktop keeps
// Enter-to-send with Shift+Enter for newlines.
const touchKeyboard = matchMedia('(pointer: coarse)').matches;
promptEl.onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !touchKeyboard) {
    e.preventDefault();
    sendPrompt();
  }
};

promptEl.oninput = () => {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px';
  stashDraft();
};

const fbEl = document.getElementById('file-browser');

const fbHiddenToggle = document.getElementById('fb-hidden-toggle');

let fbCurrentPath = '';
let fbHistory = [];

const FB_EXT_ICONS = {
  js: '{}', ts: '{}', tsx: '{}', jsx: '{}',
  py: '#', rb: '#', go: '#', rs: '#', c: '#', h: '#', cpp: '#',
  json: '{}', yaml: '~', yml: '~', toml: '~',
  md: 'M', txt: 'T', org: 'O',
  sh: '$', bash: '$', zsh: '$',
  html: '<>', css: '#', svg: '<>',
  el: 'L', clj: 'L', lisp: 'L',
};

function fbFileIcon(name, isDir) {
  if (isDir) return '\uD83D\uDCC1';
  const ext = name.split('.').pop().toLowerCase();
  return FB_EXT_ICONS[ext] || '\uD83D\uDCC4';

function fbFormatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function openFileBrowser() {
  if (!projectCwd) return;
  const startPath = projectCwd;
  fbHistory = [];
  await fbNavigate(startPath);
  fbEl.classList.add('visible');
}

function closeFileBrowser() {
  fbEl.classList.remove('visible');
}

function closeFileViewer() {
  fbViewerEl.classList.remove('visible');
}

async function fbNavigate(dirPath) {
  fbCurrentPath = dirPath;
  fbPathEl.textContent = shortPath(dirPath);
  fbListEl.innerHTML = '<div style="padding:16px;color:#888">Loading...</div>';

  try {
    const resp = await fetch(basePath + '/files/list', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ path: dirPath, showHidden: fbShowHidden })
    });
    if (!resp.ok) throw new Error(await resp.text());
    const data = await resp.json();
    fbCurrentPath = data.path;
    fbPathEl.textContent = shortPath(data.path);
    renderFileList(data.files || []);
  } catch (err) {
    fbListEl.innerHTML = '<div style="padding:16px;color:var(--red)">' + escHtml(err.message) + '</div>';
  }

function renderFileList(files) {
  fbListEl.innerHTML = '';
  if (files.length === 0) {
    fbListEl.innerHTML = '<div style="padding:16px;color:#666;text-align:center">Empty directory</div>';
    return;
  }
  for (const f of files) {
    const d = document.createElement('div');
    d.className = 'fb-item' + (f.isDir ? ' dir' : '');
    const icon = fbFileIcon(f.name, f.isDir);
    const sizeStr = f.isDir ? '' : fbFormatSize(f.size || 0);
    d.innerHTML =
      '<span class="fb-icon">' + icon + '</span>' +
      '<span class="fb-name">' + escHtml(f.name) + '</span>' +
      '<span class="fb-size">' + sizeStr + '</span>';
    if (f.isDir) {
      d.onclick = () => {
        fbHistory.push(fbCurrentPath);
        fbNavigate(fbCurrentPath + '/' + f.name);
      };
    } else {
      d.onclick = () => fbOpenFile(fbCurrentPath + '/' + f.name);
    }
    fbListEl.appendChild(d);
  }
}

function fbNavigateUp() {
  if (fbHistory.length > 0) {
    fbNavigate(fbHistory.pop());
  } else if (fbCurrentPath !== '/') {
    const parent = fbCurrentPath.replace(/\/[^/]+$/, '') || '/';
    fbNavigate(parent);
  }
}

function fbToggleHidden() {
  fbShowHidden = !fbShowHidden;
  fbHiddenToggle.classList.toggle('active', fbShowHidden);
  fbNavigate(fbCurrentPath);
}

async function fbOpenFile(filePath) {
  fbvPathEl.textContent = shortPath(filePath);
  fbvContentEl.textContent = 'Loading...';
  fbViewerEl.classList.add('visible');

  try {

      method: 'POST',

// --- Orrery (home screen: session list) ---

let discoverMode = false;
let sortMode = localStorage.getItem('acp-sort') || 'project'; // 'project' or 'recent'
let lastSessions = [];

// Card identity: buffer name first — it's the only thing that survives
// the rig's reload (SPC c y), which respawns the client with a new pid
// AND a new session id (claude resume forks).  Session id covers
// non-rig sessions; pid covers sockets still mid-handshake.
function sKey(s) {
  return s.bufferName || s.sessionId || ('pid:' + s.pid);
}
function getLastViewed(session) {
  const v = parseInt(localStorage.getItem('acp-viewed-' + sKey(session)) || '0', 10);
  // Entries written before session-keying were keyed by bare pid —
  // honor them so the switch doesn't mark every card unread once.
  const old = parseInt(localStorage.getItem('acp-viewed-' + session.pid) || '0', 10);
  return Math.max(v, old);
}
function markViewed(session) {
  localStorage.setItem('acp-viewed-' + sKey(session), String(Math.floor(Date.now() / 1000)));
}
function isUnread(session) {
  if (!session.lastActivity) return false;
  return session.lastActivity > getLastViewed(session);
}
function toggleSort() {
  sortMode = sortMode === 'project' ? 'recent' : 'project';
  localStorage.setItem('acp-sort', sortMode);
  renderSessions(lastSessions);
}

function timeAgo(ts) {
  if (!ts) return '';
  const secs = Math.floor(Date.now() / 1000) - ts;
  if (secs < 60) return 'now';
  if (secs < 3600) return Math.floor(secs / 60) + 'm';
  if (secs < 86400) return Math.floor(secs / 3600) + 'h';
  return Math.floor(secs / 86400) + 'd';
}

let lastSessionsJson = '';
let sessionsLoadSerial = 0;
let statusRequestSerial = 0;
let statusAppliedSerial = 0;
let latestStatuses = null;

// Explicit loads live in the header.  Silent background refreshes do not
// flash a spinner; they only repaint the list when data actually changes.
const navSpinEl = document.getElementById('nav-spin');
const NAV_FRAMES = ['\u280b','\u2819','\u2839','\u2838','\u283c','\u2834','\u2826','\u2827','\u2807','\u280f'];
let navSpinCount = 0, navSpinT = null, navSpinI = 0;
function navSpinStart() {
  if (++navSpinCount === 1) {
    navSpinT = setInterval(() => {
      navSpinEl.textContent = NAV_FRAMES[navSpinI = (navSpinI + 1) % NAV_FRAMES.length];
    }, 80);
  }
}
function navSpinStop() {
  if (navSpinCount > 0 && --navSpinCount === 0) {
    clearInterval(navSpinT); navSpinT = null;
    navSpinEl.textContent = '';
  }
}

// silent=true: background poll — no re-render unless the data actually
// changed, scroll position preserved.
async function loadSessions(silent) {
  const requestSerial = ++sessionsLoadSerial;
  const statusSerial = ++statusRequestSerial;
  if (!silent) { navSpinStart(); loadOrreryPins(); }
  try {
    const resp = await fetch(basePath + '/api/sessions', {
      method: 'POST', cache: 'no-store'
    });
    // A pull/resume/back navigation can overtake a slow background poll.
    // Only the newest full-list request is allowed to replace the cards.
    if (requestSerial !== sessionsLoadSerial) return;
    if (!resp.ok) {
      // Not in discover mode -- single socket, go straight to chat
      discoverMode = false;
      showChat();
      connect();
      return;
    }
    const data = await resp.json();
    if (data.version && BUILD_ID.indexOf('__') !== 0 && data.version !== BUILD_ID) {
      location.reload();
      return;
    }
    let sessions = data.sessions || [];
    const snapshot = {};
    for (const s of sessions) {
      if (s.sessionId) snapshot[s.sessionId] = s.status || '';
    }
    acceptStatusSnapshot(snapshot, statusSerial);
    sessions = applyLatestStatuses(sessions);
    if (sessions.length === 0) {
      discoverMode = true;
      lastSessions = [];
      lastSessionsJson = '[]';
      navListEl.innerHTML = '<div id="nav-empty">No active sessions</div>';
      return;
    }
    discoverMode = true;
    const j = JSON.stringify(sessions);
    if (silent && j === lastSessionsJson) return;
    lastSessionsJson = j;
    const st = navListEl.scrollTop;
    renderSessions(sessions);
    navListEl.scrollTop = st;
  } catch (err) {
    if (!silent && requestSerial === sessionsLoadSerial) {
      // /api/sessions not available -- single socket mode
      discoverMode = false;
      showChat();
      connect();
    }
  } finally {
    if (!silent) navSpinStop();
  }
}

function acceptStatusSnapshot(statuses, serial) {
  if (serial < statusAppliedSerial) return false;
  statusAppliedSerial = serial;
  latestStatuses = statuses || {};
  return true;
}

function applyLatestStatuses(sessions) {
  if (!latestStatuses) return sessions;
  return sessions.map(s => {
    if (!s.sessionId) return s;
    const next = Object.prototype.hasOwnProperty.call(latestStatuses, s.sessionId)
      ? latestStatuses[s.sessionId] : '';
    return (s.status || '') === next ? s : {...s, status: next};
  });
}

// Statuses change much more often than session identity.  This endpoint only
// reads the tiny sidecar/in-memory turn map, so it can run frequently without
// reconnecting to every multiplex socket and replaying conversation history.
async function loadStatuses() {
  if (!discoverMode || orreryEl.classList.contains('hidden')
      || document.visibilityState !== 'visible') return;
  const serial = ++statusRequestSerial;
  try {
    const resp = await fetch(basePath + '/api/statuses', {
      method: 'POST', cache: 'no-store',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ pushSince })
    });
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.version && BUILD_ID.indexOf('__') !== 0 && data.version !== BUILD_ID) {
      location.reload();
      return;
    }
    handleStatusPushes(data);
    if (!acceptStatusSnapshot(data.statuses || {}, serial)) return;
    const sessions = applyLatestStatuses(lastSessions);
    const j = JSON.stringify(sessions);
    if (j === lastSessionsJson) return;
    lastSessionsJson = j;
    const st = navListEl.scrollTop;
    renderSessions(sessions);
    navListEl.scrollTop = st;
  } catch (_) { /* transient/offline: keep the last known status */ }
}

// --- Orrery pins: chats the phone keeps at the top ---
// The set lives in the daemon (syzygy-orrery-pin-json), so a reload sees
// the same pins and a killed chat drops out on its own.  Nothing is
// persisted, and the Mac's own anchoring is a separate list on purpose.
let orreryPins = new Set();
// Every toggle bumps the generation; a report that was requested before
// the toggle is stale by the time it lands and must not undo it.
let orreryPinsGeneration = 0;
function isChatPinned(name) { return !!name && orreryPins.has(name); }
function acceptOrreryPins(pins, generation = orreryPinsGeneration) {
  if (generation !== orreryPinsGeneration) return;
  const next = new Set(Array.isArray(pins) ? pins : []);
  const same = next.size === orreryPins.size && [...next].every(n => orreryPins.has(n));
  orreryPins = next;
  if (!same && lastSessions.length && orreryEl && !orreryEl.classList.contains('hidden')) {
    const st = navListEl.scrollTop;
    renderSessions(lastSessions);
    navListEl.scrollTop = st;
  }
}
async function loadOrreryPins() {
  const generation = orreryPinsGeneration;
  try {
    const resp = await fetch(basePath + '/api/pin', { cache: 'no-store' });
    if (!resp.ok) return;
    acceptOrreryPins((await resp.json()).pins, generation);
  } catch (_) { /* the rig is away: keep the last known pins */ }
}
async function toggleChatPin(bufferName) {
  const generation = ++orreryPinsGeneration;
  const resp = await fetch(basePath + '/api/pin', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ bufferName })
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok || data.error) throw new Error(data.error || ('HTTP ' + resp.status));
  acceptOrreryPins(data.pins, generation);
  return !!data.pinned;
}
// Pinned first, then whatever order the caller already chose.
function pinnedFirst(list) {
  return [...list].sort((a, b) => Number(isChatPinned(b.bufferName)) - Number(isChatPinned(a.bufferName)));
}

function renderSessions(sessions) {
  lastSessions = sessions;
  navListEl.innerHTML = '';
  document.getElementById('nav-mode-text').textContent =
    sortMode === 'project' ? 'Projects' : 'Sessions';

  if (sortMode === 'recent') {
    // Flat list sorted by lastActivity descending, pinned chats first
    const sorted = pinnedFirst([...sessions].sort((a, b) => (b.lastActivity || 0) - (a.lastActivity || 0)));
    for (const s of sorted) {
      navListEl.appendChild(makeSessionCard(s, cardName(s)));
    }
    return;
  }

  // Group by project
  const groups = new Map();
  for (const s of sessions) {
    const proj = s.project || 'unknown';
    if (!groups.has(proj)) groups.set(proj, []);
    groups.get(proj).push(s);
  }

  const sortedKeys = [...groups.keys()].sort((a, b) => a.localeCompare(b));

  for (const proj of sortedKeys) {
    const group = groups.get(proj);
    const groupEl = document.createElement('div');
    groupEl.className = 'project-group';

    const header = document.createElement('div');
    header.className = 'project-header';
    const headerLabel = document.createElement('span');
    headerLabel.textContent = proj;
    header.appendChild(headerLabel);
    const addBtn = document.createElement('button');
    addBtn.className = 'ph-add';
    addBtn.textContent = '+';
    addBtn.onclick = (e) => { e.stopPropagation(); spawnInProject(group[0].cwd); };
    header.appendChild(addBtn);
    groupEl.appendChild(header);

    for (const s of pinnedFirst(group)) {
      groupEl.appendChild(makeSessionCard(s, cardName(s)));
    }

    navListEl.appendChild(groupEl);
  }
}

function sessionDisplayName(s) {
  const proj = s.project || 'unknown';
  return (s.title || 'Claude') + ' @ ' + proj;
}

// Card headline: user label > first-message preview > buffer name > fallback.
// The label/preview come from the server (labels.json sidecar / replay scan).
function cardName(s) {
  return s.label || s.preview || s.bufferName || sessionDisplayName(s);
}

// Match agent-recall's provider inference so live chats and archived
// transcripts use the same Anthropic/OpenAI/Gemini marks.
function providerForName(name) {
  const n = typeof name === 'string' ? name.toLowerCase() : '';
  if (/claude|anthropic/.test(n)) return 'anthropic';
  if (/codex|openai|chatgpt|gpt|\bo\d/.test(n)) return 'openai';
  if (/gemini|bard|palm|google/.test(n)) return 'gemini';
  return '';
}

function providerIcon(name) {
  const provider = providerForName(name);
  if (!provider) return '';
  const label = provider === 'anthropic' ? 'Anthropic'
    : provider === 'openai' ? 'OpenAI' : 'Google Gemini';
  return '<span class="provider-icon ' + provider + '" role="img"' +
    ' aria-label="' + label + '" title="' + label + '">' +
    '<svg aria-hidden="true" focusable="false"><use href="#provider-' +
    provider + '"></use></svg></span>';
}

function makeSessionCard(s, name) {
  const unread = isUnread(s);
  const d = document.createElement('div');
  d.className = 'session-card' + (unread ? ' unread' : '');
  const nameClass = 'sc-name' + (s.label ? ' labeled' : '');
  const dotClass = 'sc-dot' + (s.status === 'busy' ? ' busy'
    : s.status === 'permission' ? ' perm' : '');
  const statusWord = s.status === 'busy'
    ? '<span class="sc-status busy">generating</span>'
    : s.status === 'permission'
      ? '<span class="sc-status perm">needs OK</span>' : '';
  // Second line leads with the Emacs buffer name (e.g. "Claude Agent @
  // .dotfiles<15>") so a card is matchable against the rig's buffers.
  const metaParts = [escHtml(s.bufferName || (s.cwd ? shortPath(s.cwd) : '') || ''),
                     statusWord,
                     s.lastActivity ? escHtml(timeAgo(s.lastActivity)) : '']
    .filter(Boolean);
  d.innerHTML =
    '<div class="' + dotClass + '"></div>' +
    '<div class="sc-info">' +
      '<div class="sc-title">' + providerIcon(s.title || s.bufferName) +
        '<div class="' + nameClass + '">' + escHtml(name) + '</div>' +
        (s.push ? '<svg class="sc-bell" viewBox="0 0 24 24" aria-label="Phone push on"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>' : '') +
        (isChatPinned(s.bufferName) ? '<svg class="sc-pin" viewBox="0 0 24 24" aria-label="Pinned chat"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg>' : '') +
      '</div>' +
      (metaParts.length ? '<div class="sc-path">' + metaParts.join('  &middot;  ') + '</div>' : '') +
    '</div>';
  attachPeekSwipe(d, s, name);
  if (s.bufferName) {
    const del = document.createElement('button');
    del.className = 'sc-delete';
    del.textContent = '\u00d7';
    del.onclick = (e) => { e.stopPropagation(); killSessionByName(s.bufferName); };
    d.appendChild(del);
  }
  d.onclick = () => selectSession(s);
  return d;
}

function selectSession(session) {
  markViewed(session);
  stashDraft(); // the chat being left keeps its own half-typed text
  currentSockPid = session.pid;
  currentSessionKey = sKey(session);
  restoreDraft();
  // A NEW session: wipe before dialing so the old chat never sits under
  // a different session's header. Only same-session reconnects keep it.
  clearMessages();
  currentAgentMsg = null;
  currentUserMsg = null;
  resetThoughtState();
  sessionId = null;
  projectCwd = session.cwd || null;
  currentBufferName = session.bufferName || null;
  // showChat() (below) hasn't marked chatViewEl visible yet, so
  // onScreenBufferName() would still read '' here; name the chat
  // explicitly rather than depend on that class-timing.
  sendPresence(true, { bufferName: session.bufferName || '' });
  updateChatHeader();
  document.getElementById('chat-menu-btn').style.display = currentBufferName ? '' : 'none';
  availableModes = [];
  pendingPermissions = [];
  sendBtn.disabled = true;
  setProcessing(false);
  if (window.turnNav) turnNav.setEnabled(false);

  showChat();
  connect(String(session.pid));
}

// Preset chips mirror the rig's mr-x/agent-shell-presets through
// /api/presets (syzygy-presets-json), so the phone never carries a copy
// that drifts. 'default' is the phone's own entry: no preset, the rig's
// preferred config. Only the char key travels on spawn.
const DEFAULT_PRESET = {key: '', label: 'default'};
let spawnPresets = [];
let spPreset = '';
let spawnPresetsLoad = 0;
let spawnProjects = [];
let spawnProjectsLoad = 0;
// What the user has typed since the last pick. Empty means the path box
// holds a pick (or the preselected cwd), so the list shows everything.
let spProjectQuery = '';

// iOS: tapping a row while the keyboard is up used to blur the input
// first; the sheet dropped with the keyboard mid-tap and the click
// missed, so the pick only landed on a second tap (Send had the same
// bug). Cancel the focus change on touch pointerdown, then pick on
// pointerup unless the finger moved (a scroll cancels the pointer
// instead). The synthetic click that follows a touch is ignored; the
// timestamp is shared because a pick re-renders the list, so the click
// lands on a fresh element, possibly a different row. A mouse gets the
// same focus guard (the list closes on blur, so a mousedown that stole
// focus would close it before the click) and picks on click.
let spTapSuppressUntil = 0;
function onTapPick(el, fn) {
  let start = null;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (e.pointerType !== 'touch') return;
    start = {x: e.clientX, y: e.clientY};
  });
  el.addEventListener('pointerup', e => {
    if (e.pointerType !== 'touch' || !start) return;
    const moved = Math.hypot(e.clientX - start.x, e.clientY - start.y);
    start = null;
    if (moved > 12) return;
    spTapSuppressUntil = Date.now() + 600;
    fn();
  });
  el.addEventListener('pointercancel', () => { start = null; });
  el.addEventListener('click', () => {
    if (Date.now() < spTapSuppressUntil) return;
    fn();
  });
}

async function fetchSpawnProjects() {
  const resp = await fetch(basePath + '/api/projects', {method: 'POST'});
  if (!resp.ok) throw new Error('projects ' + resp.status);

  return data.projects.filter(p => p && typeof p.name === 'string' && typeof p.path === 'string');
}

function projectMatches(p, needle) {

    (p.name + ' ' + p.path + ' ' + shortPath(p.path)).toLowerCase().includes(needle);

// Rows: live first, then rig order. The typed text filters by name,
// path, or the ~ form; an exact pick shows the whole list again with
// that row marked.
function renderSpawnProjects() {
  const needle = spProjectQuery.trim().toLowerCase();
  spProjects.innerHTML = '';
  const ordered = [...spawnProjects].sort((a, b) => Number(b.live) - Number(a.live));
  let shown = 0;

    row.setAttribute('role', 'option');

    row.appendChild(dot);
    row.appendChild(pathEl);
    const base = (p.path.split('/').filter(Boolean).pop() || '').replace(/^\./, '');
    if (p.name && p.name !== base && p.name !== shortPath(p.path)) {

      nameEl.textContent = p.name;
      row.appendChild(nameEl);

    spProjects.appendChild(row);
  }
  if (!shown && spawnProjects.length) {
    const empty = document.createElement('div');
    empty.className = 'sp-row-empty';
    empty.textContent = 'no match; spawns in the path as typed';
    spProjects.appendChild(empty);
  }

function openSpawnSheet(cwd) {
