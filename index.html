<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent">
<meta name="theme-color" content="#1d2021">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>ACP</title>
<style>
/* Gruvbox dark, same face as the Emacs rig (doom-gruvbox +
   IosevkaTermSlab Nerd Font Mono): the phone is agent-shell's remote,
   so it wears the same clothes. One loud thing only: the 𐆖 prompt.
   Header colors mirror the rig's org-level grayscale ramp. */
@font-face {
  font-family: "Iosevka Term Slab";
  src: url("fonts/iosevka-regular.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Iosevka Term Slab";
  src: url("fonts/iosevka-bold.woff2") format("woff2");
  font-weight: 700; font-style: normal; font-display: swap;
}
:root {
  --bg-hard: #1d2021;   /* page (= Emacs default bg) */
  --bg0: #282828;       /* surfaces: headers, cards */
  --bg1: #3c3836;       /* raised: bubbles, inputs, borders on page */
  --bg2: #504945;       /* borders on surfaces */
  --fg: #ebdbb2;        /* = Emacs default fg */
  --fg-dim: #a89984;
  --fg-mute: #928374;
  --orange: #fe8019;    /* action */
  --yellow: #fabd2f;    /* tools, busy */
  --green: #b8bb26;     /* live, ok */
  --red: #fb4934;       /* dead, destructive */
  --aqua: #8ec07c;      /* inline code (= markdown-inline-code-face) */
  --blue: #83a598;      /* paths */
  --purple: #d3869b;    /* links (= Emacs link face) */
  --h1: #fe8019;        /* = agent-shell's org-level remap (gruvbox accents) */
  --h2: #fabd2f;
  --h3: #8ec07c;
  /* ADHD cue prefixes = agent-shell's mr-x/agent-shell-cue-*-face
     (emacs.org, "STYLING API").  One --cue-<style>-fg/bg pair per style
     in AGENT_CUES below; `cue` is the default style. */
  --cue-fg: #fb4934;         /* = mr-x/agent-shell-cue-face */
  --cue-bg: #331917;
  --cue-aside-fg: #83a598;   /* = mr-x/agent-shell-cue-aside-face */
  --cue-aside-bg: #212726;
  --mono: "Iosevka Term Slab", ui-monospace, "SF Mono", Menlo, monospace;
}
/* Phone-only overrides.  The :root block above mirrors agent-shell's
   defaults; when the phone needs to diverge, redeclare the variable here
   instead of editing the shared value, so the Emacs/phone diff stays
   visible in one place. */
:root {
}
* { box-sizing: border-box; margin: 0; padding: 0; }
* { -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--mono);
  background: var(--bg-hard); color: var(--fg);
  height: 100dvh; display: flex; flex-direction: column;
  overflow: hidden;
}

/* Orrery: the home screen, every chat and its state in one view */
#orrery {
  display: flex; flex-direction: column; height: 100%;
}
#orrery.hidden { display: none; }
#nav-header {
  display: flex; align-items: center; padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  background: var(--bg0); border-bottom: 1px solid var(--bg2);
}
#nav-header .nav-title {
  flex: 1; font-size: 18px; font-weight: 700; color: var(--fg);
  font-family: var(--mono); cursor: pointer;
  display: inline-flex; align-items: center;
}
#nav-header .nav-title:active { opacity: 0.6; }
#nav-header .nav-mode { font-size: 13px; font-weight: 500; color: var(--fg-mute); margin-left: 8px; }
/* Tap affordance: the title is the Sessions/Projects toggle */
#nav-header .nav-caret {
  color: var(--fg-mute); margin-left: 6px; flex-shrink: 0;
}
/* Loading spinner (braille frames while any fetch is in flight);
   fixed width so the header doesn't shift when it appears */
#nav-spin {
  width: 18px; text-align: center; color: var(--yellow);
  font-family: var(--mono); font-size: 15px; flex-shrink: 0;
}
#nav-header .nav-btn {
  background: transparent; border: none; color: var(--orange);
  font-size: 15px; cursor: pointer; padding: 6px 10px;
  font-family: var(--mono);
}
#nav-header .nav-btn:active { opacity: 0.6; }
#nav-list {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding-bottom: calc(82px + env(safe-area-inset-bottom));
}
#orrery { position: relative; }
#history-dock {
  display: none; position: fixed; z-index: 130;
  left: 12px; right: 12px; bottom: max(10px, env(safe-area-inset-bottom));
  align-items: center; gap: 10px;
}
#history-dock.visible { display: flex; }
/* Standalone launch: the bottom chrome paints in the wrong place until the
   first viewport recompute lands (see nudgeStandaloneViewport). Keep it
   out of sight until then, so it appears once, at its final spot. */
#history-dock, #input-area { transition: opacity 0.18s ease-out; }
html.vp-settling #history-dock, html.vp-settling #input-area { opacity: 0; pointer-events: none; transition: none; }
#history-search-form {
  min-width: 0; flex: 1; height: 48px; border-radius: 24px;
  display: flex; align-items: center; gap: 9px; padding: 0 16px;
  color: var(--fg-mute); background: var(--bg1);
  border: 1px solid var(--bg2);
  box-shadow: 0 4px 18px rgba(0,0,0,0.28);
}
#history-search-form:focus-within { border-color: var(--orange); }
#history-search-form svg { width: 18px; height: 18px; flex-shrink: 0; }
#history-search-input {
  min-width: 0; width: 100%; border: none; outline: none; background: transparent;
  color: var(--fg); font: 16px var(--mono); line-height: 1;
  -webkit-appearance: none; appearance: none;
}
#history-search-input::placeholder { color: var(--fg-mute); opacity: 1; }
/* Catalogued chip: narrows History to chats kept on purpose.  Lives in
   the search pill so it reads as part of the query, which it is: the
   chip equals a bare "#" typed into the box. */
#history-catalogued-chip {
  flex: 0 0 auto; height: 28px; padding: 0 10px; border-radius: 14px;
  border: 1px solid var(--bg2); background: transparent; color: var(--fg-mute);
  font: 11px var(--mono); font-weight: 600; letter-spacing: 0.02em;
  cursor: pointer; white-space: nowrap;
}
#history-catalogued-chip[aria-pressed="true"] {
  background: var(--orange); border-color: var(--orange); color: var(--bg-hard);
}
#spawn-btn {
  width: 48px; height: 48px; flex: 0 0 48px; border-radius: 50%;
  display: grid; place-items: center; border: none; cursor: pointer;
  color: var(--bg-hard); background: var(--orange);
  box-shadow: 0 4px 18px rgba(0,0,0,0.34);
  transition: transform 0.19s ease-out;
}
#spawn-btn:active { transform: scale(0.94); }
#spawn-btn svg { display: block; }
#ptr {
  position: absolute; left: 0; right: 0; text-align: center;
  height: 40px; line-height: 40px; pointer-events: none;
  color: var(--yellow); font-family: var(--mono); font-size: 16px;
  opacity: 0;
}
#nav-empty {
  padding: 40px 16px; text-align: center; color: var(--fg-mute); font-size: 15px;
  font-family: var(--mono);
}
.project-group {
  margin-bottom: 4px;
}
.project-header {
  padding: 10px 16px 4px; font-size: 12px; font-weight: 700;
  color: var(--yellow); letter-spacing: 0.5px;
  font-family: var(--mono);
  background: var(--bg-hard); position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
}
.project-header .ph-add {
  font-size: 16px; color: var(--fg-mute); background: none; border: none;
  padding: 0 4px; cursor: pointer; line-height: 1;
}
.project-header .ph-add:active { color: var(--orange); }
.session-card .sc-delete {
  font-size: 14px; color: var(--fg-mute); background: none; border: none;
  padding: 4px 6px; cursor: pointer; flex-shrink: 0; line-height: 1;
}
.session-card .sc-delete:active { color: var(--red); }
.session-card {
  padding: 12px 16px; border-bottom: 1px solid var(--bg0);
  cursor: pointer; display: flex; align-items: flex-start; gap: 12px;
}
.session-card:active { background: var(--bg0); }
.session-card .sc-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  margin-top: 6px; background: var(--bg2);
}
.session-card.unread .sc-dot { background: var(--green); }
.session-card .sc-dot.busy {
  background: var(--yellow);
  animation: status-pulse 1.1s ease-in-out infinite;
}
.session-card .sc-dot.perm {
  background: var(--red);
  animation: status-pulse 0.6s ease-in-out infinite;
}
@keyframes status-pulse { 50% { opacity: 0.3; } }
.sc-status { font-weight: 700; }
.sc-status.busy { color: var(--yellow); }
.sc-status.perm { color: var(--red); }
.session-card .sc-time {
  font-size: 11px; color: var(--fg-mute); margin-top: 3px;
  font-family: var(--mono);
}
.session-card .sc-info { flex: 1; min-width: 0; }
.session-card .sc-title,
.hist-card .hc-title {
  display: flex; align-items: center; gap: 8px; min-width: 0;
}
.provider-icon {
  width: 16px; height: 16px; flex: 0 0 16px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--fg);
}
.provider-icon svg { width: 100%; height: 100%; display: block; }
.provider-icon.anthropic { color: #D97757; }
.provider-sprite {
  position: absolute; width: 0; height: 0; overflow: hidden;
}
.session-card .sc-name {
  flex: 1; min-width: 0;
  font-size: 15px; font-weight: 600; color: var(--fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-card .sc-name.labeled { color: var(--orange); font-family: var(--mono); }
/* Phone push armed: filled orange bell after the name. Absent when off. */
.session-card .sc-bell {
  width: 14px; height: 14px; flex: 0 0 14px; color: var(--orange);
  fill: currentColor; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}
/* Phone pin: outlined pin after the name; the card also sorts to the top. */
.session-card .sc-pin {
  width: 14px; height: 14px; flex: 0 0 14px; color: var(--yellow);
  fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}
.session-card .sc-path {
  font-size: 12px; color: var(--blue); margin-top: 3px;
  font-family: var(--mono); opacity: 0.8;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Chat view (hidden initially in discover mode) */
#chat-view {
  display: none; flex-direction: column; height: 100%;
}
#chat-view.visible { display: flex; }

/* Header bar */
#header {
  display: flex; align-items: center; padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--bg0); border-bottom: 1px solid var(--bg2); flex-shrink: 0;
  gap: 8px;
}
#header .header-info { flex: 1; min-width: 0; }
#header .header-title {
  color: var(--fg); font-size: 15px; font-weight: 600;
  font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#header .header-title.labeled { color: var(--orange); }
#header .header-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
/* In-app push banner: a push about another chat while this app is in
   front.  iOS never tells the page about a tap on the system banner in
   that state, so this is the tap target.  Same bar language as the
   header: surface bg, orange title, dim message. */
#push-toast {
  position: fixed; left: 12px; right: 12px; z-index: 60;
  top: calc(8px + env(safe-area-inset-top));
  display: none; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  background: var(--bg0); border: 1px solid var(--bg2);
  box-shadow: 0 6px 18px rgba(0,0,0,0.45);
  font-family: var(--mono); cursor: pointer;
  transform: translateY(-8px); opacity: 0;
  transition: transform 180ms ease-out, opacity 180ms ease-out;
}
#push-toast.visible { display: flex; }
#push-toast.shown { transform: translateY(0); opacity: 1; }
#push-toast svg { width: 16px; height: 16px; flex-shrink: 0; fill: var(--orange); stroke: var(--orange); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#push-toast .pt-text { flex: 1; min-width: 0; }
#push-toast .pt-title { color: var(--orange); font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#push-toast .pt-msg { color: var(--fg-dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#push-toast .pt-close { color: var(--fg-mute); background: none; border: none; font-size: 18px; padding: 2px 6px; font-family: var(--mono); }
/* Phone push bell: outline + muted when off, filled orange when on.
   Toggles agent-shell-push-mode on the rig via /api/push. */
#header .bell-btn {
  display: none; flex-shrink: 0; width: 28px; height: 28px; padding: 0;
  margin: -4px 0; border: none; background: none; border-radius: 6px;
  color: var(--fg-mute); -webkit-tap-highlight-color: transparent;
  align-items: center; justify-content: center;
}
#header .bell-btn.visible { display: flex; }
#header .bell-btn:active { background: var(--bg2); }
#header .bell-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#header .bell-btn.on { color: var(--orange); }
#header .bell-btn.on svg { fill: currentColor; }
#header .bell-btn.pending { opacity: 0.5; }
#header .header-buf {
  font-size: 11px; color: var(--fg-mute); font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
#header .header-sub {
  display: flex; align-items: center; gap: 8px; margin-top: 2px;
}
#header .header-status {
  font-size: 11px; color: var(--fg-mute); font-family: var(--mono);
}
/* Connected is the boring default — collapse it to a green dot;
   connecting/error states keep their words. */
#header .header-status.connected { font-size: 0; }
#header .header-status.connected::before {
  content: "\25CF"; font-size: 11px; color: var(--green);
}
#header .header-status.error { color: var(--red); }
/* A drop that is still being redialed: busy-yellow, not dead-red. */
#header .header-status.reconnecting { color: var(--yellow); }
/* While the socket is down the old transcript stays on screen, but its
   permission cards belong to a request the new socket will replay
   fresh. Make them inert so a tap cannot answer a stale id. */
#messages.reconnecting .msg.permission .perm-btn { pointer-events: none; opacity: 0.5; }
#header .mode-btn {
  border: none !important; border-radius: 999px;
  padding: 2px 9px; font-size: 10px; font-weight: 600;
  color: var(--fg-dim); background: var(--bg1); cursor: pointer;
  font-family: var(--mono);
}
#header .mode-btn:active { opacity: 0.7; }
#header .back-btn {
  background: transparent; border: none; color: var(--orange);
  font-size: 18px; cursor: pointer; padding: 4px 8px;
  display: none;
}
#header .back-btn:active { opacity: 0.6; }
#header .header-actions {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}

#header .files-btn {
  background: transparent; border: 1px solid var(--bg2); border-radius: 6px;
  color: var(--fg-dim); padding: 6px 10px; font-size: 12px; cursor: pointer;
  font-family: var(--mono);
}
#header .files-btn:active { opacity: 0.7; }
/* File browser adds little on a phone — parked until it earns the spot */
#files-btn { display: none; }

/* File browser overlay */
#file-browser {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-hard); z-index: 100; flex-direction: column;
}
#file-browser.visible { display: flex; }
#fb-header {
  display: flex; align-items: center; padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--bg0); border-bottom: 1px solid var(--bg2); gap: 8px;
}
#fb-header .fb-back {
  background: transparent; border: none; color: var(--orange);
  font-size: 16px; cursor: pointer; padding: 4px 8px;
}
#fb-header .fb-path {
  flex: 1; font-size: 13px; color: var(--fg-dim);
  font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#fb-header .fb-close {
  background: transparent; border: none; color: var(--fg-mute);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
#fb-header .fb-hidden-toggle {
  background: transparent; border: 1px solid var(--bg2); border-radius: 4px;
  color: var(--fg-mute); font-size: 10px; padding: 2px 6px; cursor: pointer;
  font-family: var(--mono);
}
#fb-header .fb-hidden-toggle.active { color: var(--green); border-color: var(--green); }
#fb-list {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.fb-item {
  display: flex; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--bg0); cursor: pointer; gap: 10px;
}
.fb-item:active { background: var(--bg0); }
.fb-item .fb-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.fb-item .fb-name {
  flex: 1; font-size: 15px; color: var(--fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--mono);
}
.fb-item .fb-size { font-size: 12px; color: var(--fg-mute); flex-shrink: 0; font-family: var(--mono); }
.fb-item.dir .fb-name { color: var(--blue); }
#fb-viewer {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-hard); z-index: 101; flex-direction: column;
}
#fb-viewer.visible { display: flex; }
#fbv-header {
  display: flex; align-items: center; padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--bg0); border-bottom: 1px solid var(--bg2); gap: 8px;
}
#fbv-header .fbv-back {
  background: transparent; border: none; color: var(--orange);
  font-size: 16px; cursor: pointer; padding: 4px 8px;
}
#fbv-header .fbv-path {
  flex: 1; font-size: 13px; color: var(--fg-dim);
  font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  direction: rtl; text-align: left;
}
#fbv-content {
  flex: 1; overflow: auto; padding: 12px;
  font-family: var(--mono); font-size: 12px;
  color: var(--fg); white-space: pre-wrap; line-height: 1.5;
  -webkit-overflow-scrolling: touch;
}

/* Messages area */
#messages {
  flex: 1; overflow-y: auto; padding: 16px;
  -webkit-overflow-scrolling: touch;
}

/* Shared message container */
.msg {
  margin-bottom: 12px; padding: 12px; border-radius: 10px;
  line-height: 1.5; word-wrap: break-word; overflow-wrap: break-word;
}

/* Role label */
.msg .role {
  font-size: 11px; font-weight: 600; color: var(--fg-dim);
  margin-bottom: 4px; display: block; font-family: var(--mono);
}

/* User messages — a prompt line, not an iMessage bubble. The 𐆖 rail
   is the one loud element on the page. */
.msg.user {
  background: var(--bg1); max-width: 85%; align-self: flex-end;
  margin-left: auto; border-left: 3px solid var(--orange);
  border-radius: 4px 10px 10px 4px; position: relative;
}
.msg.user .role { color: var(--orange); }
.msg.user .role::before { content: "𐆖 "; }
.msg.user .text {
  color: var(--fg); font-size: 14px; line-height: 21px;
  font-family: var(--mono);
}
.msg.user .text:empty { display: none; }
.msg.user.has-images { width: 85%; }
.sent-images {
  display: grid; grid-template-columns: 1fr; gap: 6px; margin: 2px 0 8px;
}
.sent-images.multiple { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sent-images img {
  display: block; width: 100%; height: auto; max-height: 320px;
  object-fit: contain; border-radius: 8px; background: var(--bg-hard);
  cursor: zoom-in; touch-action: manipulation;
}
.sent-images.multiple img { aspect-ratio: 1; object-fit: cover; }
.sent-image-omitted {
  margin: 2px 0 8px; padding: 8px 10px; border: 1px solid var(--bg1);
  border-radius: 8px; color: var(--fg-mute); font-size: 12px;
}
.sent-refs {
  display: flex; flex-direction: column; align-items: flex-start;
  gap: 6px; margin: 2px 0 8px;
}
.sent-ref { max-width: 100%; }
.ref-pill {
  max-width: 100%; min-height: 32px; padding: 5px 9px;
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-hard); border: 1px solid var(--bg2);
  border-radius: 8px; color: var(--yellow); font-family: var(--mono);
  font-size: 12px; font-weight: 700; cursor: pointer; text-align: left;
  touch-action: manipulation;
}
.ref-pill .ref-pill-text {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ref-pill .ref-pill-arrow {
  color: var(--fg-mute); flex-shrink: 0; display: inline-block;
}
.ref-pill[aria-expanded="true"] .ref-pill-arrow { transform: rotate(90deg); }
.sent-ref-detail {
  margin-top: 5px; padding: 8px 10px; max-width: 100%;
  border-left: 2px solid var(--bg2); color: var(--fg-dim);
  font-size: 12px; line-height: 1.5; white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.sent-ref-detail[hidden] { display: none; }
.msg.user .meta {
  display: flex; justify-content: flex-end; align-items: center;
  gap: 4px; margin-top: 6px;
}
.msg.user .meta .time { color: var(--fg-mute); font-size: 10px; font-family: var(--mono); }
.msg.user .meta .delivery { color: var(--green); font-size: 10px; }

/* Agent messages */
.msg.agent {
  background: var(--bg0); max-width: 85%; width: 85%;
  align-self: flex-start;
}
.msg.agent .role { color: var(--aqua); }

/* Thought messages */
.msg.thought {
  background: var(--bg0); border-left: 3px solid var(--yellow);
  border-radius: 4px 8px 8px 4px; color: var(--fg-mute); font-style: normal;
  font-size: 13px; padding: 8px 12px; max-width: 100%; width: 100%;
  box-sizing: border-box; align-self: flex-start;
}
.msg.thought .md {
  color: var(--fg-mute); font-size: 13px; line-height: 18px;
  max-width: 100%; min-width: 0; overflow-wrap: anywhere;
}
.msg.thought .md p { margin: 2px 0; }
.msg.thought .md strong { color: var(--fg); font-weight: 700; }
.msg.thought .md em { font-style: italic; }
.msg.thought .md a { color: var(--purple); text-decoration: underline; }
.msg.thought .md code { font-family: var(--mono); }
.msg.thought .md code:not(pre code) {
  background: var(--bg-hard); padding: 1px 4px; border-radius: 3px;
  color: var(--aqua); font-size: 12px;
}
.msg.thought .md .code-block {
  margin: 4px 0; overflow: hidden;
  background: var(--bg-hard); border: 1px solid var(--bg1); border-radius: 6px;
}
.msg.thought .md pre {
  background: transparent; border: 0; padding: 8px; margin: 0;
  overflow-x: auto; font-size: 12px; line-height: 1.35;
}
.msg.thought .md ul, .msg.thought .md ol {
  margin: 2px 0; padding-left: 18px;
}
.msg.thought .md li { margin: 1px 0; }
.msg.thought .md h1, .msg.thought .md h2, .msg.thought .md h3 {
  margin: 5px 0 2px; color: var(--fg-dim); font-family: var(--mono);
  font-weight: 700; line-height: 1.3;
}
.msg.thought .md h1 { font-size: 13px; }
.msg.thought .md h2 { font-size: 12.5px; }
.msg.thought .md h3 { font-size: 12px; }
.msg.thought .md blockquote {
  border-left: 2px solid var(--bg2); padding-left: 8px;
  color: var(--fg-mute); margin: 3px 0;
}
.msg.thought .md hr {
  border: none; border-top: 1px solid var(--bg1); margin: 4px 0;
}

/* System messages */
.msg.system {
  background: transparent; padding: 8px 16px; max-width: 100%;
  text-align: center;
}
.msg.system .text {
  color: var(--yellow); font-size: 12px; font-style: italic;
}

/* Error messages */
.msg.error {
  background: rgba(251,73,52,0.08); border-left: 3px solid var(--red);
  border-radius: 4px 10px 10px 4px; padding: 12px; max-width: 100%;
  display: flex; align-items: flex-start; gap: 8px;
}
.msg.error .error-icon { font-size: 16px; flex-shrink: 0; }
.msg.error .text {
  color: var(--red); font-size: 14px;
  font-family: var(--mono); flex: 1;
}

/* Tool calls */
.msg.tool {
  background: var(--bg0); border-left: 3px solid var(--yellow);
  border-radius: 4px 8px 8px 4px; padding: 8px 12px; max-width: 100%;
  font-size: 13px; cursor: pointer; user-select: none;
  -webkit-user-select: none;
}
.msg.tool .tool-header {
  display: flex; align-items: flex-start; gap: 8px;
}
.msg.tool .tool-icon { font-size: 14px; flex-shrink: 0; }
.msg.tool .tool-info { flex: 1; min-width: 0; }
.msg.tool .tool-name {
  font-family: var(--mono); font-size: 13px;
  color: var(--fg-dim); word-break: break-word;
}
.msg.tool .tool-name.completed { color: var(--green); }
.msg.tool .tool-name.failed { color: var(--red); }
.msg.tool .tool-path {
  font-family: var(--mono); font-size: 11px;
  color: var(--blue); margin-top: 2px;
  word-break: break-all;
}
.msg.tool .tool-expand { color: var(--fg-mute); font-size: 10px; margin-left: 8px; }
.msg.tool .tool-body {
  display: none; margin-top: 8px; padding: 8px;
  background: var(--bg-hard); border-radius: 6px;
  font-family: var(--mono); font-size: 11px;
  color: var(--fg); white-space: pre-wrap; max-height: 300px;
  overflow-y: auto; line-height: 16px;
}
.msg.tool .tool-separator {
  border: none; border-top: 1px solid var(--bg2); margin: 8px 0;
}
.msg.tool.expanded .tool-body { display: block; }
.msg.tool .tool-hint {
  color: var(--fg-mute); font-size: 10px; margin-top: 4px; font-style: italic;
}
.msg.tool.expanded .tool-hint { display: none; }

/* Permission request cards */
.msg.permission {
  background: var(--bg0); border-left: 3px solid var(--yellow);
  border-radius: 4px 8px 8px 4px; padding: 12px; max-width: 100%;
  font-size: 13px;
}
.msg.permission .perm-header {
  display: flex; align-items: flex-start; gap: 8px;
}
.msg.permission .perm-icon { font-size: 14px; flex-shrink: 0; }
.msg.permission .perm-info { flex: 1; min-width: 0; }
.msg.permission .perm-title {
  font-family: var(--mono); font-size: 13px;
  color: var(--yellow); font-weight: 600;
}
.msg.permission .perm-path {
  font-family: var(--mono); font-size: 11px;
  color: var(--blue); margin-top: 2px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.msg.permission .perm-detail {
  margin-top: 8px; padding: 8px; background: var(--bg-hard);
  border-radius: 6px; font-family: var(--mono);
  font-size: 11px; color: var(--fg); white-space: pre-wrap;
  max-height: 200px; overflow-y: auto; line-height: 16px;
}
.msg.permission .perm-options {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
}
.msg.permission .perm-btn {
  border: none; border-radius: 8px; padding: 10px 14px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: opacity 0.15s; font-family: var(--mono);
}
.msg.permission .perm-btn:active { opacity: 0.7; }
.msg.permission .perm-btn.allow {
  background: #79740e; color: var(--fg);
}
.msg.permission .perm-btn.allow-always {
  background: rgba(184,187,38,0.18); color: var(--green);
}
.msg.permission .perm-btn.reject {
  background: #9d0006; color: var(--fg);
}
.msg.permission .perm-btn.reject-always {
  background: rgba(251,73,52,0.18); color: var(--red);
}
.msg.permission .perm-btn:disabled {
  opacity: 0.3; cursor: default;
}
.msg.permission .perm-btn.selected {
  opacity: 1; outline: 2px solid var(--fg); outline-offset: 1px;
}
.msg.permission.resolved .perm-title { color: var(--fg-mute); }
.msg.permission.resolved { border-left-color: var(--bg2); }

/* Diff rendering in tool bodies */
.msg.tool .diff-header { color: var(--fg-mute); font-weight: 600; }
.msg.tool .diff-removed {
  color: var(--red); background: rgba(251,73,52,0.1);
}
.msg.tool .diff-added {
  color: var(--green); background: rgba(184,187,38,0.1);
}

/* Copy toast */
#toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--bg2); color: var(--fg); padding: 8px 20px;
  border-radius: 20px; font-size: 13px; opacity: 0;
  transition: opacity 0.3s; pointer-events: none; z-index: 100;
  font-family: var(--mono);
}
#toast.visible { opacity: 1; }

/* Thinking indicator */
#thinking {
  display: none; padding: 8px 16px; flex-shrink: 0;
  background: var(--bg0); border-top: 1px solid var(--bg2);
}
#thinking.visible { display: flex; align-items: center; gap: 8px; }
#thinking .spinner {
  color: var(--yellow); font-size: 14px; font-family: var(--mono);
  width: 16px; text-align: center;
}
#thinking .label { color: var(--fg-mute); font-size: 12px; font-family: var(--mono); }

/* Scroll-to-bottom button */
#scroll-btn {
  display: none; position: fixed; bottom: 80px; right: 16px;
  width: 44px; height: 44px; border-radius: 22px;
  background: var(--purple); border: none; color: var(--bg-hard);
  font-size: 20px; font-weight: 700; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 10;
}
#scroll-btn.visible {
  display: flex; align-items: center; justify-content: center;
}
#scroll-btn:active { background: #b16286; }

/* Turn nav: bare arrows above the scroll button, no chrome so the chat
   stays readable underneath. Each arrow takes the color of the block it
   would land on: orange = a prompt (matches the You role), aqua = a
   response (matches the Agent role). The mode glyph between them cycles
   prompt -> response -> alternate. */
#turn-nav {
  display: none; position: fixed; right: 12px; bottom: 150px; z-index: 10;
  flex-direction: column; align-items: center;
  font-family: var(--mono); user-select: none; -webkit-user-select: none;
}
#turn-nav.visible { display: flex; }
#turn-nav.over-history { z-index: 129; }
#turn-nav button {
  background: none; border: none; padding: 2px 12px; cursor: pointer;
  color: var(--fg-mute); font-size: 26px; font-weight: 700; line-height: 1;
  text-shadow: 0 0 6px var(--bg-hard), 0 0 3px var(--bg-hard), 0 1px 2px rgba(0,0,0,0.8);
  -webkit-tap-highlight-color: transparent;
}
#turn-nav button.prompt { color: var(--orange); }
#turn-nav button.response { color: var(--aqua); }
#turn-nav button[disabled] { opacity: 0.25; }
#turn-nav button:active:not([disabled]) { transform: scale(0.85); }
#turn-nav-mode { font-size: 13px; letter-spacing: 1px; padding: 4px 12px; }
#turn-nav-mode.alternate { color: var(--orange); }
#turn-nav-mode.alternate span { color: var(--aqua); }
:is(.msg, .pv-msg).turn-nav-hit-prompt, :is(.msg, .pv-msg).turn-nav-hit-response {
  transition: box-shadow 0.15s ease-out;
}
:is(.msg, .pv-msg).turn-nav-hit-prompt { box-shadow: 0 0 0 2px var(--orange), 0 0 12px var(--orange); }
:is(.msg, .pv-msg).turn-nav-hit-response { box-shadow: 0 0 0 2px var(--aqua), 0 0 12px var(--aqua); }

/* Swipe navigation indicator */
#swipe-indicator {
  display: none; position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(29,32,33,0.92); color: var(--fg); padding: 12px 24px;
  border-radius: 12px; font-size: 15px; font-weight: 600;
  z-index: 50; pointer-events: none; text-align: center;
  max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--mono); border: 1px solid var(--bg2);
}
#swipe-indicator.visible { display: block; }
#swipe-indicator .swipe-dir {
  font-size: 11px; color: var(--fg-mute); margin-bottom: 4px; display: block;
}

/* Input area */
#input-area {
  border-top: 1px solid var(--bg2); padding: 12px;
  display: flex; gap: 10px; flex-shrink: 0;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--bg0); align-items: flex-end;
}
#prompt {
  flex: 1; background: var(--bg1); border: none;
  border-radius: 12px; color: var(--fg); padding: 10px 16px;
  font-size: 16px; font-family: var(--mono); resize: none;
  min-height: 44px; max-height: 100px; line-height: 1.4;
  caret-color: var(--orange);
}
#prompt:focus { outline: none; }
#prompt::placeholder { color: var(--fg-mute); }
/* Peek sheet: tail of a convo without opening it */
#preview-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; z-index: 119;
}
#preview-scrim.visible { display: block; }
#preview-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 120;
  background: var(--bg0); border-top: 1px solid var(--bg2);
  border-radius: 16px 16px 0 0; max-height: 70dvh;
  display: none; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
#preview-sheet.visible { display: flex; }
#pv-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--bg1);
}
#pv-title {
  flex: 1; font-size: 13px; font-weight: 600; color: var(--fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#pv-open {
  background: var(--orange); border: none; border-radius: 8px;
  color: var(--bg-hard); font-size: 12px; font-weight: 700;
  padding: 8px 12px; cursor: pointer; font-family: var(--mono);
}
#pv-close {
  background: none; border: none; color: var(--fg-mute);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
#pv-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 12px 16px;
  background: var(--bg-hard); /* chat canvas, so bubbles read like the real convo */
}
/* Compact versions of the chat's bubble language: user = orange-railed
   prompt line pushed right, agent = flat surface card on the left. */
.pv-msg { margin-bottom: 10px; font-size: 13px; line-height: 1.5;
  word-break: break-word; padding: 10px 12px; border-radius: 10px; }
.pv-msg.user {
  background: var(--bg1); color: var(--fg); font-family: var(--mono);
  white-space: pre-wrap; width: fit-content; max-width: 85%;
  margin-left: auto; border-left: 3px solid var(--orange);
  border-radius: 4px 10px 10px 4px;
}
.pv-msg.user::before { content: "𐆖 "; color: var(--orange); }
.pv-msg.agent { background: var(--bg0); color: var(--fg); }
.session-card { touch-action: pan-y; }

/* Swipe-left a message → mini menu (view/copy/pin) + full-screen reader.
   Selection stays disabled on the chrome (nav, headers, buttons) so a
   stray long-press never highlights the UI, but is ENABLED on message
   bubbles so you can long-press to select/copy text inline. Also on:
   inputs, the reader, the file viewer. */
html, body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
input, textarea, #fbv-content, .msg, .msg * {
  -webkit-touch-callout: default;
  -webkit-user-select: text; user-select: text;
}
#mm-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: none; z-index: 129;
}
#mm-scrim.visible { display: block; }
#msg-menu {
  position: fixed; left: 16px; right: 16px; z-index: 130;
  bottom: max(16px, env(safe-area-inset-bottom));
  background: var(--bg1); border: 1px solid var(--bg2); border-radius: 14px;
  display: none; flex-direction: column; overflow: hidden;
}
#msg-menu.visible { display: flex; }
#msg-menu button {
  background: none; border: none; color: var(--fg); font-family: var(--mono);
  font-size: 15px; padding: 15px; cursor: pointer; text-align: center;
}
#msg-menu button + button { border-top: 1px solid var(--bg2); }
#msg-menu button:active { background: var(--bg2); }
/* Chat ⋮ menu: same bottom-sheet pattern as the message menu */
#cm-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: none; z-index: 129;
}
#cm-scrim.visible { display: block; }
#chat-menu {
  position: fixed; left: 16px; right: 16px; z-index: 130;
  bottom: max(16px, env(safe-area-inset-bottom));
  background: var(--bg1); border: 1px solid var(--bg2); border-radius: 14px;
  display: none; flex-direction: column; overflow: hidden;
}
#chat-menu.visible { display: flex; }
#chat-menu button {
  background: none; border: none; color: var(--fg); font-family: var(--mono);
  font-size: 15px; padding: 15px; cursor: pointer; text-align: center;
}
#chat-menu button + button { border-top: 1px solid var(--bg2); }
#chat-menu button:active { background: var(--bg2); }
#chat-menu button:disabled { color: var(--fg-mute); cursor: default; }
#reader {
  position: fixed; inset: 0; z-index: 131; background: var(--bg0);
  display: none; flex-direction: column;
}
#reader.visible { display: flex; }
#reader-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px;
  border-bottom: 1px solid var(--bg2); flex-shrink: 0;
}
#reader-title {
  font-size: 12px; font-family: var(--mono); color: var(--fg-mute);
}
#reader-controls { display: flex; align-items: center; gap: 4px; }
#reader-smaller, #reader-bigger {
  background: var(--bg1); border: 1px solid var(--bg2); border-radius: 8px;
  color: var(--fg); font-family: var(--mono); font-size: 13px;
  padding: 6px 10px; cursor: pointer;
}
#reader-smaller:active, #reader-bigger:active { background: var(--bg2); }
#reader-close {
  background: none; border: none; color: var(--fg);
  font-size: 26px; line-height: 1; padding: 2px 6px 2px 10px; cursor: pointer;
}
#reader-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
}
/* The cloned bubble keeps its chat chrome (background, accent border,
   role label) — just full-width and enlarged.  Size is a variable so
   the A−/A+ controls only ever touch the reader. */
#reader-body .msg {
  max-width: none; width: auto; margin: 0; padding: 16px;
  font-size: var(--reader-fs, 19px); line-height: 1.65;
  pointer-events: auto;
  -webkit-touch-callout: default;
  -webkit-user-select: text; user-select: text;
}
/* Keep the cloned bubble read-only: text selects, but links/buttons in
   the clone stay inert (no navigating out of the reader). */
#reader-body .msg a, #reader-body .msg button { pointer-events: none; }
#reader-body .msg button.code-copy,
#reader-body .msg button.ref-pill { pointer-events: auto; }
/* Chat children pin their own px sizes (.text 14px, code 13px, h1-h3
   16/15/14...) which override the bubble's size — inside the reader,
   re-scale them relative to --reader-fs so A−/A+ moves everything. */
#reader-body .msg .text,
#reader-body .msg .md,
#reader-body .msg .tool-body {
  font-size: inherit; line-height: inherit;
}
#reader-body .msg .md pre { font-size: 0.8em; line-height: 1.45; }
#reader-body .msg .md code:not(pre code) { font-size: 0.85em; }
#reader-body .msg .md h1 { font-size: 1.25em; }
#reader-body .msg .md h2 { font-size: 1.15em; }
#reader-body .msg .md h3 { font-size: 1.05em; }
#reader-body .msg.user.has-images { width: auto; }
#reader-body .sent-images { grid-template-columns: 1fr; }
#reader-body .sent-images img {
  max-height: none; aspect-ratio: auto; object-fit: contain; cursor: default;
}

/* Pinned messages: header pin → full-screen per-convo list, view-only.
   Sits below the reader (131) so tapping a pin opens the reader on top. */
#pins {
  position: fixed; inset: 0; z-index: 128; background: var(--bg0);
  display: none; flex-direction: column;
}
#pins.visible { display: flex; }
#pins-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px;
  border-bottom: 1px solid var(--bg2); flex-shrink: 0;
}
#pins-title {
  flex: 1; font-size: 12px; font-family: var(--mono); color: var(--fg-mute);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#pins-back {
  background: none; border: none; color: var(--orange);
  font-size: 20px; line-height: 1; padding: 2px 10px 2px 0; cursor: pointer;
}
#pins-close {
  background: none; border: none; color: var(--fg);
  font-size: 26px; line-height: 1; padding: 2px 6px 2px 10px; cursor: pointer;
}
#pins-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
}
.pin-item { margin-bottom: 16px; }
/* Lighter separation than the main window's chat cards, but visible */
.pin-item + .pin-item { border-top: 1px solid var(--bg1); padding-top: 14px; }
.pin-meta {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; font-family: var(--mono); color: var(--fg-mute);
  margin-bottom: 6px;
}
.pin-unpin {
  background: none; border: none; color: var(--fg-mute);
  font-family: var(--mono); font-size: 11px; padding: 2px 6px; cursor: pointer;
}
.pin-unpin:active { color: var(--red); }
/* Stored bubble renders full-width and inert; tap opens the reader */
.pin-item .msg { max-width: none; width: auto; margin: 0; pointer-events: none; }
.pins-empty {
  color: var(--fg-mute); font-size: 14px; font-family: var(--mono);
  padding: 32px 16px; text-align: center; line-height: 1.6;
}
/* Global pinned view: one card per convo (mirrors .session-card),
   tap → that convo's pins */
.pin-chat-card {
  padding: 12px 16px; margin: 0 -18px; border-bottom: 1px solid var(--bg1);
  cursor: pointer;
}
.pin-chat-card:active { background: var(--bg1); }
.pin-chat-card .pc-name {
  font-size: 15px; font-weight: 600; color: var(--orange);
  font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pin-chat-card .pc-preview {
  font-size: 12px; color: var(--fg-dim); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pin-chat-card .pc-meta {
  font-size: 11px; color: var(--fg-mute); margin-top: 3px;
  font-family: var(--mono);
}
#nav-pins-btn svg { display: block; }
#nav-history-btn svg { display: block; }
#nav-settings-btn svg { display: block; }
/* Settings: app-wide preferences (mirrors the #pins overlay) */
#settings {
  position: fixed; inset: 0; z-index: 128; background: var(--bg0);
  display: none; flex-direction: column;
}
#settings.visible { display: flex; }
#settings-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px;
  border-bottom: 1px solid var(--bg2); flex-shrink: 0;
}
#settings-title {
  flex: 1; font-size: 12px; font-family: var(--mono); color: var(--fg-mute);
}
#settings-close {
  background: none; border: none; color: var(--fg);
  font-size: 26px; line-height: 1; padding: 2px 6px 2px 10px; cursor: pointer;
}
#settings-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
}
.set-section { margin-bottom: 28px; }
.set-section h2 {
  margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; font-family: var(--mono); color: var(--fg-mute);
}
.set-mute { font-size: 14px; color: var(--fg-mute); font-family: var(--mono); }
.set-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; gap: 12px;
}
.set-row + .set-row { border-top: 1px solid var(--bg1); }
.set-row label { font-size: 15px; color: var(--fg); }
/* Segmented two-way toggle; the chosen half takes the orange accent */
.seg {
  display: inline-flex; border: 1px solid var(--bg2); border-radius: 8px;
  overflow: hidden; flex-shrink: 0;
}
.seg button {
  background: none; border: none; color: var(--fg-mute); cursor: pointer;
  padding: 7px 14px; font-size: 13px; font-family: var(--mono);
  -webkit-tap-highlight-color: transparent;
}
.seg button + button { border-left: 1px solid var(--bg2); }
.seg button.on { background: var(--bg1); color: var(--orange); }
/* History: browse agent-recall transcripts (mirrors the #pins overlay) */
#history {
  position: fixed; inset: 0; z-index: 128; background: var(--bg0);
  display: none; flex-direction: column;
}
#history.visible { display: flex; }
#history-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: max(10px, env(safe-area-inset-top)) 16px 10px;
  border-bottom: 1px solid var(--bg2); flex-shrink: 0;
}
#history-title {
  flex: 1; font-size: 12px; font-family: var(--mono); color: var(--fg-mute);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#history-back {
  background: none; border: none; color: var(--orange);
  font-size: 20px; line-height: 1; padding: 2px 10px 2px 0; cursor: pointer;
}
#history-resume {
  background: var(--orange); border: none; border-radius: 5px;
  color: var(--bg0); cursor: pointer; font-family: var(--mono);
  font-size: 11px; font-weight: 700; margin-left: 10px; padding: 6px 9px;
}
#history-resume:disabled {
  background: var(--bg2); color: var(--fg-mute); cursor: default;
}
#history-close {
  background: none; border: none; color: var(--fg);
  font-size: 26px; line-height: 1; padding: 2px 6px 2px 10px; cursor: pointer;
}
#history-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 18px 18px calc(92px + env(safe-area-inset-bottom));
}
.hist-card {
  padding: 12px 16px; margin: 0 -18px; border-bottom: 1px solid var(--bg1);
  cursor: pointer;
}
.hist-card:active { background: var(--bg1); }
.hist-card .hc-name {
  flex: 1; min-width: 0;
  font-size: 14px; color: var(--fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.hist-card .hc-meta {
  font-size: 11px; color: var(--fg-mute); margin-top: 4px;
  font-family: var(--mono);
}
.hist-card .hc-snippet {
  font-size: 12px; color: var(--fg-dim); margin: 5px 0 0 24px;
  line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
/* Provider logo + agent badge: same identity treatment as agent-recall. */
.hc-agent { font-family: var(--mono); font-weight: 600; }
.hc-agent.claude { color: var(--orange); }
.hc-agent.codex { color: var(--aqua); }
.hc-agent.other { color: var(--blue); }
/* Catalogue on a History row: the note under the preview, tags as chips. */
.hist-card .hc-note {
  font-size: 12px; color: var(--fg); margin: 5px 0 0 24px; line-height: 1.4;
  font-family: var(--mono); display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.hist-card .hc-note::before { content: "why: "; color: var(--fg-mute); }
.hc-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 0 24px; }
.hc-tag {
  font: 11px var(--mono); color: var(--aqua); border: 1px solid var(--bg2);
  border-radius: 10px; padding: 1px 7px; line-height: 1.5;
}
.hc-kept { color: var(--yellow); font-weight: 600; }
#history-catalogue {
  background: none; border: 1px solid var(--bg2); border-radius: 5px;
  color: var(--fg); cursor: pointer; font-family: var(--mono);
  font-size: 11px; font-weight: 700; margin-left: 10px; padding: 5px 9px;
}
#history-catalogue:disabled { color: var(--fg-mute); cursor: default; }
#history-catalogue.kept { border-color: var(--yellow); color: var(--yellow); }
.hist-catalogued {
  margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--bg2);
  border-left: 3px solid var(--yellow); border-radius: 6px;
  font: 12px var(--mono); color: var(--fg); line-height: 1.5; cursor: pointer;
}
.hist-catalogued .hc-kept { display: block; font-size: 11px; }
.hist-catalogued .hc-tags { margin-left: 0; }
.hist-empty {
  color: var(--fg-mute); font-size: 14px; font-family: var(--mono);
  padding: 32px 16px; text-align: center; line-height: 1.6;
}
/* Transcript view: reuse the peek sheet's bubble styles (.pv-msg) */
#history-body .pv-msg { max-width: none; }
#history-body .pv-msg.hist-match {
  outline: 2px solid var(--orange); outline-offset: 3px;
}
#history-body mark {
  color: var(--bg-hard); background: var(--yellow); border-radius: 2px;
  padding: 0 1px;
}
.hist-note {
  color: var(--fg-mute); font-size: 11px; font-family: var(--mono);
  text-align: center; margin-bottom: 12px;
}

/* Spawn sheet: new convo from the phone */
#spawn-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; z-index: 139;
}
#spawn-scrim.visible { display: block; }
#spawn-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 140;
  background: var(--bg0); border-top: 1px solid var(--bg2);
  border-radius: 16px 16px 0 0; max-height: 94dvh;
  display: none; flex-direction: column;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}
#spawn-sheet.visible { display: flex; }
#sp-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--bg1);
}
#sp-title { flex: 1; font-size: 14px; font-weight: 700; color: var(--fg); }
#sp-close {
  background: none; border: none; color: var(--fg-mute);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
#sp-body { overflow-y: auto; padding: 14px 16px; }
.sp-label {
  font-size: 11px; font-weight: 700; color: var(--yellow);
  margin: 12px 0 6px; letter-spacing: 0.5px;
}
.sp-label:first-child { margin-top: 0; }
.sp-hint { color: var(--fg-mute); font-weight: 400; letter-spacing: 0; }
#sp-presets {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
}
/* Project combobox: #sp-dir is both the typed path and the filter; the
   list under it scrolls on its own so the sheet keeps its shape. */
#sp-projects {
  display: none; flex-direction: column; margin-top: 6px;
  max-height: 228px; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  border: 1px solid var(--bg1); border-radius: 10px;
}
#sp-projects.open { display: flex; }
#sp-projects:empty { display: none; }
.sp-row {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: none; border: none; border-bottom: 1px solid var(--bg1);
  padding: 10px 12px; font-size: 14px; color: var(--fg-dim);
  text-align: left; cursor: pointer; font-family: var(--mono);
  touch-action: pan-y;
}
.sp-row:last-child { border-bottom: none; }
.sp-row:active { background: var(--bg1); }
.sp-row.sel { color: var(--orange); }
.sp-row-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--bg2);
}
.sp-row.live .sp-row-dot { background: var(--orange); }
.sp-row-path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-row-name { color: var(--fg-mute); font-size: 12px; flex-shrink: 0; }
.sp-row-empty { color: var(--fg-mute); font-size: 12px; padding: 10px 12px; }
.sp-chip {
  background: var(--bg1); border: 1px solid var(--bg2); border-radius: 999px;
  padding: 7px 13px; font-size: 13px; color: var(--fg-dim);
  white-space: nowrap; cursor: pointer; flex-shrink: 0; font-family: var(--mono);
  transition: transform 0.19s ease-out;
}
.sp-chip:active { transform: scale(0.96); }
.sp-chip.sel { border-color: var(--orange); color: var(--orange); }
#sp-dir, #sp-name, #sp-task {
  width: 100%; background: var(--bg1); border: none; border-radius: 10px;
  color: var(--fg); padding: 11px 14px; font-size: 16px;
  font-family: var(--mono); resize: none; caret-color: var(--orange);
}
#sp-dir:focus, #sp-name:focus, #sp-task:focus { outline: 1px solid var(--bg2); }
#sp-go {
  width: 100%; margin-top: 16px; background: var(--green); border: none;
  border-radius: 12px; color: var(--bg-hard); font-size: 15px; font-weight: 700;
  padding: 13px; cursor: pointer; font-family: var(--mono);
  transition: transform 0.19s ease-out;
}
#sp-go:active { transform: scale(0.97); }
#sp-go:disabled { background: var(--bg1); color: var(--fg-mute); }

/* Model picker */
#model-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; z-index: 139;
}
#model-scrim.visible { display: block; }
#model-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 140;
  background: var(--bg0); border-top: 1px solid var(--bg2);
  border-radius: 16px 16px 0 0; max-height: 80dvh;
  display: none; flex-direction: column;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}
#model-sheet.visible { display: flex; }
#md-head { display: flex; align-items: center; padding: 14px 16px; }
#md-title { flex: 1; font-size: 14px; font-weight: 700; color: var(--fg); }
#md-close {
  background: none; border: none; color: var(--fg-mute);
  font: inherit; cursor: pointer; padding: 4px 8px;
}
#md-body { overflow-y: auto; padding: 0 16px 14px; }
#md-list { display: flex; flex-direction: column; gap: 8px; }
.md-row {
  background: var(--bg1); border: 1px solid var(--bg2); border-radius: 10px;
  padding: 12px 14px; color: var(--fg-dim); font-family: var(--mono);
  text-align: left; cursor: pointer; overflow-wrap: anywhere;
}
.md-row.sel { border-color: var(--orange); color: var(--orange); }
.md-row:disabled { cursor: default; opacity: 0.65; }
.md-description { display: block; margin-top: 4px; color: var(--fg-mute); }
.md-message { margin: 0; color: var(--fg-mute); }

/* Attachments: image thumbs + quote chips above the composer. */
#attach-row {
  display: none; gap: 10px; padding: 10px 12px 0; align-items: center;
  background: var(--bg0); border-top: 1px solid var(--bg2);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
#attach-row.has-items { display: flex; }
#attach-row.has-items + #input-area { border-top: none; }
.attach-chip { position: relative; flex-shrink: 0; }
.attach-chip img {
  width: 56px; height: 56px; object-fit: cover; display: block;
  border-radius: 8px; border: 1px solid var(--bg2);
}
.attach-chip.ref-chip {
  display: flex; align-items: center; gap: 7px;
  min-height: 44px; max-width: 220px; padding: 8px 30px 8px 10px;
  background: var(--bg-hard); border: 1px solid var(--bg2);
  border-radius: 9px; color: var(--yellow);
}
.ref-chip .ref-chip-text {
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; color: var(--fg-dim); font-size: 12px;
}
.attach-chip .chip-x {
  position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
  border-radius: 10px; background: var(--red); color: var(--bg-hard);
  border: none; font-size: 12px; font-weight: 700; line-height: 1;
  cursor: pointer; padding: 0;
}
#attach-btn {
  background: var(--bg1); border: 1px solid transparent; border-radius: 12px;
  color: var(--orange); font-size: 24px; font-weight: 400;
  min-width: 44px; min-height: 44px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s ease, color 0.15s ease,
    border-color 0.15s ease, transform 0.19s ease-out, box-shadow 0.15s ease;
}
#attach-btn:active { opacity: 0.7; transform: scale(0.96); }
#attach-btn.ref-ready {
  background: var(--orange); border-color: var(--orange); color: var(--bg-hard);
  font-size: 20px; font-weight: 700;
  box-shadow: 0 0 0 3px rgba(254, 128, 25, 0.2);
  animation: ref-ready-pop 0.2s cubic-bezier(0.18, 1.25, 0.4, 1);
}
#attach-btn.ref-ready:active { opacity: 1; transform: scale(0.94); }
@keyframes ref-ready-pop {
  from { transform: scale(0.82); }
  to { transform: scale(1); }
}
#attach-input { display: none; }

/* New outgoing messages ease up from the composer instead of popping.
   Deliberately NOT gated on prefers-reduced-motion — the animation was
   asked for by name, and iOS has Reduce Motion on half the time.
   Easing is a plain ease-out: the earlier overshoot spring finished ~90%
   of its travel in the first 60ms (3-4 frames), which read as instant. */
.msg.msg-in {
  animation: msg-in 0.65s cubic-bezier(0.33, 1, 0.68, 1);
}
@keyframes msg-in {
  from { opacity: 0; transform: translateY(26px) scale(0.94); }
}

/* Send = gruvbox green ("go" in the rig's color language); icon, not glyph */
#send {
  background: var(--green); border: none; border-radius: 12px;
  color: var(--bg-hard); padding: 10px 18px;
  cursor: pointer; flex-shrink: 0; min-width: 60px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.19s ease-out, background 0.15s ease;
}
#send:active { background: #98971a; transform: scale(0.96); }
/* iOS drops touches that land on the SVG icon while the textarea is
   focused (elementFromPoint returns the <path>, no touch/pointer event is
   dispatched, the field just blurs). Route hits to the button itself. */
#send svg { pointer-events: none; }
#send:disabled { background: var(--bg1); color: var(--fg-mute); }
#stop-btn {
  background: var(--red); border: none; border-radius: 12px;
  color: var(--bg-hard); padding: 10px 18px; font-size: 16px; font-weight: 700;
  cursor: pointer; flex-shrink: 0; min-width: 60px; min-height: 44px;
  display: none; font-family: var(--mono);
}
#stop-btn:active { background: #cc241d; }

/* Markdown in agent messages */
:is(.msg.agent, .pv-msg.agent) .md .code-block {
  margin: 6px 0; overflow: hidden;
  background: var(--bg-hard); border: 1px solid var(--bg1);
  border-radius: 7px;
}
.code-header {
  min-height: 32px; padding: 2px 4px 2px 10px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg0); border-bottom: 1px solid var(--bg1);
}
.code-language {
  color: var(--fg-mute); font-family: var(--mono); font-size: 10px;
  font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
}
:is(.msg.agent, .pv-msg.agent) .md pre {
  background: transparent; border: 0; border-radius: 0;
  padding: 10px; margin: 0;
  overflow-x: auto; font-size: 13px; line-height: 1.4;
  -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
}
.code-copy {
  width: 32px; height: 28px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--fg-mute);
  cursor: pointer; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.code-copy svg {
  width: 16px; height: 16px; fill: none; stroke: currentColor;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.code-copy .code-copy-check { display: none; }
.code-copy:active { background: var(--bg1); color: var(--fg); }
.code-copy:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
.code-copy.copied {
  background: var(--bg1); color: var(--green); border-color: var(--bg2);
}
.code-copy.copied .code-copy-icon { display: none; }
.code-copy.copied .code-copy-check { display: block; }
:is(.msg.agent, .pv-msg.agent) .md code {
  font-family: var(--mono);
}
:is(.msg.agent, .pv-msg.agent) .md code:not(pre code) {
  background: var(--bg-hard); padding: 2px 5px; border-radius: 3px;
  color: var(--aqua); font-size: 13px;
}
:is(.msg.agent, .pv-msg.agent) .md strong { font-weight: 700; }
:is(.msg.agent, .pv-msg.agent) .md em { font-style: italic; }
:is(.msg.agent, .pv-msg.agent) .md a { color: var(--purple); text-decoration: underline; }
/* Markers take agent-shell's mr-x/agent-shell-list-marker yellow so numbering
   reads as chrome, not prose. No panel behind the block: at phone width the
   items wrap to three lines each, so the gap between items — not a border —
   is what separates them. */
:is(.msg.agent, .pv-msg.agent) .md ul, :is(.msg.agent, .pv-msg.agent) .md ol {
  margin: 12px 0; padding: 0 0 0 30px;
}
:is(.msg.agent, .pv-msg.agent) .md li { margin: 0; }
:is(.msg.agent, .pv-msg.agent) .md li + li { margin-top: 12px; }
:is(.msg.agent, .pv-msg.agent) .md li::marker {
  color: var(--yellow); font-weight: 700;
}
/* Same heading ramp as agent-shell's org-level face remap (orange/yellow/aqua) */
:is(.msg.agent, .pv-msg.agent) .md h1, :is(.msg.agent, .pv-msg.agent) .md h2, :is(.msg.agent, .pv-msg.agent) .md h3 {
  margin: 10px 0 4px 0; font-weight: 700;
  font-family: var(--mono);
}
:is(.msg.agent, .pv-msg.agent) .md h1 { font-size: 16px; color: var(--h1); }
:is(.msg.agent, .pv-msg.agent) .md h2 { font-size: 15px; color: var(--h2); }
:is(.msg.agent, .pv-msg.agent) .md h3 { font-size: 14px; color: var(--h3); }
:is(.msg.agent, .pv-msg.agent) .md blockquote {
  border-left: 3px solid var(--bg2); padding-left: 12px;
  color: var(--fg-dim); margin: 6px 0;
}
:is(.msg.agent, .pv-msg.agent) .md hr {
  border: none; border-top: 1px solid var(--bg1); margin: 8px 0;
}
:is(.msg.agent, .pv-msg.agent) .md p { margin: 4px 0; }
:is(.msg.agent, .pv-msg.agent) .md { color: var(--fg); font-size: 15px; line-height: 22px; }
:is(.msg.agent, .pv-msg.agent) .agent-cue-prefix {
  color: var(--cue-fg); background: var(--cue-bg); font-weight: 700;
}
:is(.msg.agent, .pv-msg.agent) .agent-cue-prefix[data-style="aside"] {
  color: var(--cue-aside-fg); background: var(--cue-aside-bg);
}
/* Peek sheet: same markdown look as bubbles, but at the sheet's compact size */
.pv-msg.agent .md { font-size: 13px; line-height: 1.5; }
.pv-msg.agent .md h1 { font-size: 14px; }
.pv-msg.agent .md h2 { font-size: 13.5px; }
.pv-msg.agent .md h3 { font-size: 13px; }
.pv-msg.agent .md pre { font-size: 12px; }
.pv-msg.agent .md code:not(pre code) { font-size: 12px; }
</style>
</head>
<body>
<!-- Provider marks shared with agent-recall's transcript pickers. -->
<svg class="provider-sprite" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="provider-gemini-gradient" x1="0" y1="24" x2="24" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285F4"/>
      <stop offset="0.5" stop-color="#9B72CB"/>
      <stop offset="1" stop-color="#D96570"/>
    </linearGradient>
  </defs>
  <symbol id="provider-anthropic" viewBox="0 0 24 24">
    <path fill="currentColor" d="M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z"/>
