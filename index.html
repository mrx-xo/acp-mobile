<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent">
<meta name="theme-color" content="#1d2021">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>ACP</title>
<style>
/* Gruvbox dark, same face as the Emacs rig (doom-gruvbox +
   IosevkaTermSlab Nerd Font Mono): the phone is agent-shell's remote,
   so it wears the same clothes. One loud thing only: the 𐆖 prompt.
   Header colors mirror the rig's org-level grayscale ramp. */
@font-face {
  font-family: "Iosevka Term Slab";
  src: url("fonts/iosevka-regular.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "Iosevka Term Slab";
  src: url("fonts/iosevka-bold.woff2") format("woff2");
  font-weight: 700; font-style: normal; font-display: swap;
}
:root {
  --bg-hard: #1d2021;   /* page (= Emacs default bg) */
  --bg0: #282828;       /* surfaces: headers, cards */
  --bg1: #3c3836;       /* raised: bubbles, inputs, borders on page */
  --bg2: #504945;       /* borders on surfaces */
  --fg: #ebdbb2;        /* = Emacs default fg */
  --fg-dim: #a89984;
  --fg-mute: #928374;
  --orange: #fe8019;    /* action */
  --yellow: #fabd2f;    /* tools, busy */
  --green: #b8bb26;     /* live, ok */
  --red: #fb4934;       /* dead, destructive */
  --aqua: #8ec07c;      /* inline code (= markdown-inline-code-face) */
  --blue: #83a598;      /* paths */
  --purple: #d3869b;    /* links (= Emacs link face) */
  --h1: #c8c8c8;        /* org-level-1..3 grayscale ramp */
  --h2: #a8a8a8;
  --h3: #909090;
  --mono: "Iosevka Term Slab", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
* { -webkit-tap-highlight-color: transparent; }

body {
  font-family: var(--mono);
  background: var(--bg-hard); color: var(--fg);
  height: 100dvh; display: flex; flex-direction: column;
  overflow: hidden;
}

/* Navigator (session list) */
#navigator {
  display: flex; flex-direction: column; height: 100%;
}
#navigator.hidden { display: none; }
#nav-header {
  display: flex; align-items: center; padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  background: var(--bg0); border-bottom: 1px solid var(--bg2);
}
#nav-header .nav-title {
  flex: 1; font-size: 18px; font-weight: 700; color: var(--fg);
  font-family: var(--mono);
}
#nav-header .nav-btn {
  background: transparent; border: none; color: var(--orange);
  font-size: 15px; cursor: pointer; padding: 6px 10px;
  font-family: var(--mono);
}
#nav-header .nav-btn:active { opacity: 0.6; }
#refresh-btn.spin { animation: refresh-rot 0.8s linear infinite; }
@keyframes refresh-rot { to { transform: rotate(360deg); } }
#nav-list {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
#navigator { position: relative; }
#ptr {
  position: absolute; left: 0; right: 0; text-align: center;
  height: 40px; line-height: 40px; pointer-events: none;
  color: var(--yellow); font-family: var(--mono); font-size: 16px;
  opacity: 0;
}
#nav-empty {
  padding: 40px 16px; text-align: center; color: var(--fg-mute); font-size: 15px;
  font-family: var(--mono);
}
.project-group {
  margin-bottom: 4px;
}
.project-header {
  padding: 10px 16px 4px; font-size: 12px; font-weight: 700;
  color: var(--yellow); letter-spacing: 0.5px;
  font-family: var(--mono);
  background: var(--bg-hard); position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
}
.project-header .ph-add {
  font-size: 16px; color: var(--fg-mute); background: none; border: none;
  padding: 0 4px; cursor: pointer; line-height: 1;
}
.project-header .ph-add:active { color: var(--orange); }
.session-card .sc-delete {
  font-size: 14px; color: var(--fg-mute); background: none; border: none;
  padding: 4px 6px; cursor: pointer; flex-shrink: 0; line-height: 1;
}
.session-card .sc-delete:active { color: var(--red); }
.session-card {
  padding: 12px 16px; border-bottom: 1px solid var(--bg0);
  cursor: pointer; display: flex; align-items: flex-start; gap: 12px;
}
.session-card:active { background: var(--bg0); }
.session-card .sc-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  margin-top: 6px; background: var(--bg2);
}
.session-card.unread .sc-dot { background: var(--green); }
.session-card .sc-dot.busy {
  background: var(--yellow);
  animation: status-pulse 1.1s ease-in-out infinite;
}
.session-card .sc-dot.perm {
  background: var(--red);
  animation: status-pulse 0.6s ease-in-out infinite;
}
@keyframes status-pulse { 50% { opacity: 0.3; } }
.sc-status { font-weight: 700; }
.sc-status.busy { color: var(--yellow); }
.sc-status.perm { color: var(--red); }
.session-card .sc-time {
  font-size: 11px; color: var(--fg-mute); margin-top: 3px;
  font-family: var(--mono);
}
.session-card .sc-info { flex: 1; min-width: 0; }
.session-card .sc-name {
  font-size: 15px; font-weight: 600; color: var(--fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.session-card .sc-name.labeled { color: var(--orange); font-family: var(--mono); }
.session-card .sc-path {
  font-size: 12px; color: var(--blue); margin-top: 3px;
  font-family: var(--mono); opacity: 0.8;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Chat view (hidden initially in discover mode) */
#chat-view {
  display: none; flex-direction: column; height: 100%;
}
#chat-view.visible { display: flex; }

/* Header bar */
#header {
  display: flex; align-items: center; padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--bg0); border-bottom: 1px solid var(--bg2); flex-shrink: 0;
  gap: 8px;
}
#header .header-info { flex: 1; min-width: 0; }
#header .header-title {
  color: var(--fg); font-size: 15px; font-weight: 600;
  font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#header .header-sub {
  display: flex; align-items: center; gap: 8px; margin-top: 2px;
}
#header .header-status {
  font-size: 11px; color: var(--fg-mute); font-family: var(--mono);
}
/* Connected is the boring default — collapse it to a green dot;
   connecting/error states keep their words. */
#header .header-status.connected { font-size: 0; }
#header .header-status.connected::before {
  content: "\25CF"; font-size: 11px; color: var(--green);
}
#header .header-status.error { color: var(--red); }
#header .mode-btn {
  border: none !important; border-radius: 999px;
  padding: 2px 9px; font-size: 10px; font-weight: 600;
  color: var(--fg-dim); background: var(--bg1); cursor: pointer;
  font-family: var(--mono);
}
#header .mode-btn:active { opacity: 0.7; }
#header .back-btn {
  background: transparent; border: none; color: var(--orange);
  font-size: 18px; cursor: pointer; padding: 4px 8px;
  display: none;
}
#header .back-btn:active { opacity: 0.6; }
#header .header-actions {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}

#header .files-btn {
  background: transparent; border: 1px solid var(--bg2); border-radius: 6px;
  color: var(--fg-dim); padding: 6px 10px; font-size: 12px; cursor: pointer;
  font-family: var(--mono);
}
#header .files-btn:active { opacity: 0.7; }
/* File browser adds little on a phone — parked until it earns the spot */
#files-btn { display: none; }

/* File browser overlay */
#file-browser {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-hard); z-index: 100; flex-direction: column;
}
#file-browser.visible { display: flex; }
#fb-header {
  display: flex; align-items: center; padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--bg0); border-bottom: 1px solid var(--bg2); gap: 8px;
}
#fb-header .fb-back {
  background: transparent; border: none; color: var(--orange);
  font-size: 16px; cursor: pointer; padding: 4px 8px;
}
#fb-header .fb-path {
  flex: 1; font-size: 13px; color: var(--fg-dim);
  font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#fb-header .fb-close {
  background: transparent; border: none; color: var(--fg-mute);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
#fb-header .fb-hidden-toggle {
  background: transparent; border: 1px solid var(--bg2); border-radius: 4px;
  color: var(--fg-mute); font-size: 10px; padding: 2px 6px; cursor: pointer;
  font-family: var(--mono);
}
#fb-header .fb-hidden-toggle.active { color: var(--green); border-color: var(--green); }
#fb-list {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.fb-item {
  display: flex; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--bg0); cursor: pointer; gap: 10px;
}
.fb-item:active { background: var(--bg0); }
.fb-item .fb-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
.fb-item .fb-name {
  flex: 1; font-size: 15px; color: var(--fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--mono);
}
.fb-item .fb-size { font-size: 12px; color: var(--fg-mute); flex-shrink: 0; font-family: var(--mono); }
.fb-item.dir .fb-name { color: var(--blue); }
#fb-viewer {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg-hard); z-index: 101; flex-direction: column;
}
#fb-viewer.visible { display: flex; }
#fbv-header {
  display: flex; align-items: center; padding: 10px 12px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: var(--bg0); border-bottom: 1px solid var(--bg2); gap: 8px;
}
#fbv-header .fbv-back {
  background: transparent; border: none; color: var(--orange);
  font-size: 16px; cursor: pointer; padding: 4px 8px;
}
#fbv-header .fbv-path {
  flex: 1; font-size: 13px; color: var(--fg-dim);
  font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  direction: rtl; text-align: left;
}
#fbv-content {
  flex: 1; overflow: auto; padding: 12px;
  font-family: var(--mono); font-size: 12px;
  color: var(--fg); white-space: pre-wrap; line-height: 1.5;
  -webkit-overflow-scrolling: touch;
}

/* Messages area */
#messages {
  flex: 1; overflow-y: auto; padding: 16px;
  -webkit-overflow-scrolling: touch;
}

/* Shared message container */
.msg {
  margin-bottom: 12px; padding: 12px; border-radius: 10px;
  line-height: 1.5; word-wrap: break-word; overflow-wrap: break-word;
}

/* Role label */
.msg .role {
  font-size: 11px; font-weight: 600; color: var(--fg-dim);
  margin-bottom: 4px; display: block; font-family: var(--mono);
}

/* User messages — a prompt line, not an iMessage bubble. The 𐆖 rail
   is the one loud element on the page. */
.msg.user {
  background: var(--bg1); max-width: 85%; align-self: flex-end;
  margin-left: auto; border-left: 3px solid var(--orange);
  border-radius: 4px 10px 10px 4px; position: relative;
}
.msg.user .role { color: var(--orange); }
.msg.user .role::before { content: "𐆖 "; }
.msg.user .text {
  color: var(--fg); font-size: 14px; line-height: 21px;
  font-family: var(--mono);
}
.msg.user .meta {
  display: flex; justify-content: flex-end; align-items: center;
  gap: 4px; margin-top: 6px;
}
.msg.user .meta .time { color: var(--fg-mute); font-size: 10px; font-family: var(--mono); }
.msg.user .meta .delivery { color: var(--green); font-size: 10px; }

/* Agent messages */
.msg.agent {
  background: var(--bg0); max-width: 85%; width: 85%;
  align-self: flex-start;
}
.msg.agent .role { color: var(--aqua); }

/* Thought messages */
.msg.thought {
  background: transparent; color: var(--fg-mute); font-style: italic;
  font-size: 13px; padding: 4px 16px; max-width: 100%;
}

/* System messages */
.msg.system {
  background: transparent; padding: 8px 16px; max-width: 100%;
  text-align: center;
}
.msg.system .text {
  color: var(--yellow); font-size: 12px; font-style: italic;
}

/* Error messages */
.msg.error {
  background: rgba(251,73,52,0.08); border-left: 3px solid var(--red);
  border-radius: 4px 10px 10px 4px; padding: 12px; max-width: 100%;
  display: flex; align-items: flex-start; gap: 8px;
}
.msg.error .error-icon { font-size: 16px; flex-shrink: 0; }
.msg.error .text {
  color: var(--red); font-size: 14px;
  font-family: var(--mono); flex: 1;
}

/* Tool calls */
.msg.tool {
  background: var(--bg0); border-left: 3px solid var(--yellow);
  border-radius: 4px 8px 8px 4px; padding: 8px 12px; max-width: 100%;
  font-size: 13px; cursor: pointer; user-select: none;
  -webkit-user-select: none;
}
.msg.tool .tool-header {
  display: flex; align-items: flex-start; gap: 8px;
}
.msg.tool .tool-icon { font-size: 14px; flex-shrink: 0; }
.msg.tool .tool-info { flex: 1; min-width: 0; }
.msg.tool .tool-name {
  font-family: var(--mono); font-size: 13px;
  color: var(--fg-dim); word-break: break-word;
}
.msg.tool .tool-name.completed { color: var(--green); }
.msg.tool .tool-name.failed { color: var(--red); }
.msg.tool .tool-path {
  font-family: var(--mono); font-size: 11px;
  color: var(--blue); margin-top: 2px;
  word-break: break-all;
}
.msg.tool .tool-expand { color: var(--fg-mute); font-size: 10px; margin-left: 8px; }
.msg.tool .tool-body {
  display: none; margin-top: 8px; padding: 8px;
  background: var(--bg-hard); border-radius: 6px;
  font-family: var(--mono); font-size: 11px;
  color: var(--fg); white-space: pre-wrap; max-height: 300px;
  overflow-y: auto; line-height: 16px;
}
.msg.tool.expanded .tool-body { display: block; }
.msg.tool .tool-hint {
  color: var(--fg-mute); font-size: 10px; margin-top: 4px; font-style: italic;
}
.msg.tool.expanded .tool-hint { display: none; }

/* Permission request cards */
.msg.permission {
  background: var(--bg0); border-left: 3px solid var(--yellow);
  border-radius: 4px 8px 8px 4px; padding: 12px; max-width: 100%;
  font-size: 13px;
}
.msg.permission .perm-header {
  display: flex; align-items: flex-start; gap: 8px;
}
.msg.permission .perm-icon { font-size: 14px; flex-shrink: 0; }
.msg.permission .perm-info { flex: 1; min-width: 0; }
.msg.permission .perm-title {
  font-family: var(--mono); font-size: 13px;
  color: var(--yellow); font-weight: 600;
}
.msg.permission .perm-path {
  font-family: var(--mono); font-size: 11px;
  color: var(--blue); margin-top: 2px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.msg.permission .perm-detail {
  margin-top: 8px; padding: 8px; background: var(--bg-hard);
  border-radius: 6px; font-family: var(--mono);
  font-size: 11px; color: var(--fg); white-space: pre-wrap;
  max-height: 200px; overflow-y: auto; line-height: 16px;
}
.msg.permission .perm-options {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;
}
.msg.permission .perm-btn {
  border: none; border-radius: 8px; padding: 10px 14px;
  font-size: 13px; font-weight: 600; cursor: pointer;
  transition: opacity 0.15s; font-family: var(--mono);
}
.msg.permission .perm-btn:active { opacity: 0.7; }
.msg.permission .perm-btn.allow {
  background: #79740e; color: var(--fg);
}
.msg.permission .perm-btn.allow-always {
  background: rgba(184,187,38,0.18); color: var(--green);
}
.msg.permission .perm-btn.reject {
  background: #9d0006; color: var(--fg);
}
.msg.permission .perm-btn.reject-always {
  background: rgba(251,73,52,0.18); color: var(--red);
}
.msg.permission .perm-btn:disabled {
  opacity: 0.3; cursor: default;
}
.msg.permission .perm-btn.selected {
  opacity: 1; outline: 2px solid var(--fg); outline-offset: 1px;
}
.msg.permission.resolved .perm-title { color: var(--fg-mute); }
.msg.permission.resolved { border-left-color: var(--bg2); }

/* Diff rendering in tool bodies */
.msg.tool .diff-header { color: var(--fg-mute); font-weight: 600; }
.msg.tool .diff-removed {
  color: var(--red); background: rgba(251,73,52,0.1);
}
.msg.tool .diff-added {
  color: var(--green); background: rgba(184,187,38,0.1);
}

/* Copy toast */
#toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--bg2); color: var(--fg); padding: 8px 20px;
  border-radius: 20px; font-size: 13px; opacity: 0;
  transition: opacity 0.3s; pointer-events: none; z-index: 100;
  font-family: var(--mono);
}
#toast.visible { opacity: 1; }

/* Thinking indicator */
#thinking {
  display: none; padding: 8px 16px; flex-shrink: 0;
  background: var(--bg0); border-top: 1px solid var(--bg2);
}
#thinking.visible { display: flex; align-items: center; gap: 8px; }
#thinking .spinner {
  color: var(--yellow); font-size: 14px; font-family: var(--mono);
  width: 16px; text-align: center;
}
#thinking .label { color: var(--fg-mute); font-size: 12px; font-family: var(--mono); }

/* Scroll-to-bottom button */
#scroll-btn {
  display: none; position: fixed; bottom: 80px; right: 16px;
  width: 44px; height: 44px; border-radius: 22px;
  background: var(--bg2); border: 1px solid var(--fg-mute); color: var(--fg);
  font-size: 20px; font-weight: 600; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 10;
}
#scroll-btn.visible {
  display: flex; align-items: center; justify-content: center;
}
#scroll-btn:active { background: var(--bg1); }

/* Swipe navigation indicator */
#swipe-indicator {
  display: none; position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(29,32,33,0.92); color: var(--fg); padding: 12px 24px;
  border-radius: 12px; font-size: 15px; font-weight: 600;
  z-index: 50; pointer-events: none; text-align: center;
  max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--mono); border: 1px solid var(--bg2);
}
#swipe-indicator.visible { display: block; }
#swipe-indicator .swipe-dir {
  font-size: 11px; color: var(--fg-mute); margin-bottom: 4px; display: block;
}

/* Input area */
#input-area {
  border-top: 1px solid var(--bg2); padding: 12px;
  display: flex; gap: 10px; flex-shrink: 0;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: var(--bg0); align-items: flex-end;
}
#prompt {
  flex: 1; background: var(--bg1); border: none;
  border-radius: 12px; color: var(--fg); padding: 10px 16px;
  font-size: 16px; font-family: var(--mono); resize: none;
  min-height: 44px; max-height: 100px; line-height: 1.4;
  caret-color: var(--orange);
}
#prompt:focus { outline: none; }
#prompt::placeholder { color: var(--fg-mute); }
/* Peek sheet: tail of a convo without opening it */
#preview-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; z-index: 119;
}
#preview-scrim.visible { display: block; }
#preview-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 120;
  background: var(--bg0); border-top: 1px solid var(--bg2);
  border-radius: 16px 16px 0 0; max-height: 70dvh;
  display: none; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
#preview-sheet.visible { display: flex; }
#pv-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--bg1);
}
#pv-title {
  flex: 1; font-size: 13px; font-weight: 600; color: var(--fg);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#pv-open {
  background: var(--orange); border: none; border-radius: 8px;
  color: var(--bg-hard); font-size: 12px; font-weight: 700;
  padding: 8px 12px; cursor: pointer; font-family: var(--mono);
}
#pv-close {
  background: none; border: none; color: var(--fg-mute);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
#pv-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 12px 16px;
}
.pv-msg { margin-bottom: 12px; font-size: 13px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word; }
.pv-msg.user { color: var(--orange); }
.pv-msg.user::before { content: "𐆖 "; }
.pv-msg.agent { color: var(--fg); }
.session-card { touch-action: pan-y; }

/* Spawn sheet: new convo from the phone */
#spawn-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; z-index: 119;
}
#spawn-scrim.visible { display: block; }
#spawn-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 120;
  background: var(--bg0); border-top: 1px solid var(--bg2);
  border-radius: 16px 16px 0 0; max-height: 80dvh;
  display: none; flex-direction: column;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}
#spawn-sheet.visible { display: flex; }
#sp-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--bg1);
}
#sp-title { flex: 1; font-size: 14px; font-weight: 700; color: var(--fg); }
#sp-close {
  background: none; border: none; color: var(--fg-mute);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
}
#sp-body { overflow-y: auto; padding: 14px 16px; }
.sp-label {
  font-size: 11px; font-weight: 700; color: var(--yellow);
  margin: 12px 0 6px; letter-spacing: 0.5px;
}
.sp-label:first-child { margin-top: 0; }
.sp-hint { color: var(--fg-mute); font-weight: 400; letter-spacing: 0; }
#sp-projects {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
}
.sp-chip {
  background: var(--bg1); border: 1px solid var(--bg2); border-radius: 999px;
  padding: 7px 13px; font-size: 13px; color: var(--fg-dim);
  white-space: nowrap; cursor: pointer; flex-shrink: 0; font-family: var(--mono);
}
.sp-chip.sel { border-color: var(--orange); color: var(--orange); }
#sp-dir, #sp-name, #sp-task {
  width: 100%; background: var(--bg1); border: none; border-radius: 10px;
  color: var(--fg); padding: 11px 14px; font-size: 16px;
  font-family: var(--mono); resize: none; caret-color: var(--orange);
}
#sp-dir:focus, #sp-name:focus, #sp-task:focus { outline: 1px solid var(--bg2); }
#sp-go {
  width: 100%; margin-top: 16px; background: var(--green); border: none;
  border-radius: 12px; color: var(--bg-hard); font-size: 15px; font-weight: 700;
  padding: 13px; cursor: pointer; font-family: var(--mono);
  transition: transform 0.12s ease;
}
#sp-go:active { transform: scale(0.97); }
#sp-go:disabled { background: var(--bg1); color: var(--fg-mute); }

/* Attachments: thumb chips above the composer, + button beside it */
#attach-row {
  display: none; gap: 10px; padding: 10px 12px 0;
  background: var(--bg0); border-top: 1px solid var(--bg2);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
#attach-row.has-items { display: flex; }
#attach-row.has-items + #input-area { border-top: none; }
.attach-chip { position: relative; flex-shrink: 0; }
.attach-chip img {
  width: 56px; height: 56px; object-fit: cover; display: block;
  border-radius: 8px; border: 1px solid var(--bg2);
}
.attach-chip .chip-x {
  position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
  border-radius: 10px; background: var(--red); color: var(--bg-hard);
  border: none; font-size: 12px; font-weight: 700; line-height: 1;
  cursor: pointer; padding: 0;
}
#attach-btn {
  background: var(--bg1); border: none; border-radius: 12px;
  color: var(--orange); font-size: 24px; font-weight: 400;
  min-width: 44px; min-height: 44px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
#attach-btn:active { opacity: 0.7; }
#attach-input { display: none; }

/* New outgoing messages ease in instead of popping */
@media (prefers-reduced-motion: no-preference) {
  .msg.msg-in {
    animation: msg-in 0.28s cubic-bezier(0.21, 1.02, 0.55, 1);
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
  }
}

/* Send = gruvbox green ("go" in the rig's color language); icon, not glyph */
#send {
  background: var(--green); border: none; border-radius: 12px;
  color: var(--bg-hard); padding: 10px 18px;
  cursor: pointer; flex-shrink: 0; min-width: 60px; min-height: 44px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.12s ease, background 0.15s ease;
}
#send:active { background: #98971a; transform: scale(0.92); }
#send:disabled { background: var(--bg1); color: var(--fg-mute); }
#stop-btn {
  background: var(--red); border: none; border-radius: 12px;
  color: var(--bg-hard); padding: 10px 18px; font-size: 16px; font-weight: 700;
  cursor: pointer; flex-shrink: 0; min-width: 60px; min-height: 44px;
  display: none; font-family: var(--mono);
}
#stop-btn:active { background: #cc241d; }

/* Markdown in agent messages */
.msg.agent .md pre {
  background: var(--bg-hard); border: 1px solid var(--bg1);
  border-radius: 6px; padding: 10px; margin: 6px 0;
  overflow-x: auto; font-size: 13px; line-height: 1.4;
}
.msg.agent .md code {
  font-family: var(--mono);
}
.msg.agent .md code:not(pre code) {
  background: var(--bg-hard); padding: 2px 5px; border-radius: 3px;
  color: var(--aqua); font-size: 13px;
}
.msg.agent .md strong { font-weight: 700; }
.msg.agent .md em { font-style: italic; }
.msg.agent .md a { color: var(--purple); text-decoration: underline; }
.msg.agent .md ul, .msg.agent .md ol {
  margin: 4px 0; padding-left: 20px;
}
.msg.agent .md li { margin: 2px 0; }
/* Same grayscale heading ramp as the rig's org-level faces */
.msg.agent .md h1, .msg.agent .md h2, .msg.agent .md h3 {
  margin: 10px 0 4px 0; font-weight: 700;
  font-family: var(--mono);
}
.msg.agent .md h1 { font-size: 16px; color: var(--h1); }
.msg.agent .md h2 { font-size: 15px; color: var(--h2); }
.msg.agent .md h3 { font-size: 14px; color: var(--h3); }
.msg.agent .md blockquote {
  border-left: 3px solid var(--bg2); padding-left: 12px;
  color: var(--fg-dim); margin: 6px 0;
}
.msg.agent .md hr {
  border: none; border-top: 1px solid var(--bg1); margin: 8px 0;
}
.msg.agent .md p { margin: 4px 0; }
.msg.agent .md { color: var(--fg); font-size: 15px; line-height: 22px; }
</style>
</head>

<script nonce="__CSP_NONCE__">
const messagesEl = document.getElementById('messages');
const statusText = document.getElementById('status-text');
const headerTitle = document.getElementById('header-title');
const modeBtn = document.getElementById('mode-btn');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop-btn');
const thinkingEl = document.getElementById('thinking');
const scrollBtn = document.getElementById('scroll-btn');
const navigatorEl = document.getElementById('navigator');
const chatViewEl = document.getElementById('chat-view');
const navListEl = document.getElementById('nav-list');
const backBtn = document.getElementById('back-btn');

// iOS keyboard fix: the layout viewport ignores the keyboard, so a
// bottom-pinned composer disappears behind it. Track the *visual*
// viewport and size the body to it; re-pin chat scroll if it was at
// the bottom.
if (window.visualViewport) {
  const vv = window.visualViewport;
  const syncViewport = () => {
    const wasAtBottom = isAtBottom;
    document.body.style.height = vv.height + 'px';
    window.scrollTo(0, 0);
    // Bottom sheets are fixed to the LAYOUT viewport, but the keyboard
    // only shrinks the VISUAL one — lift them above it and cap their
    // height so the focused input and the action button stay reachable.
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    for (const id of ['spawn-sheet', 'preview-sheet']) {
      const el = document.getElementById(id);
      if (!el) continue;
      el.style.bottom = kb > 0 ? kb + 'px' : '';
      el.style.maxHeight = kb > 0 ? Math.round(vv.height * 0.92) + 'px' : '';
    }
    if (wasAtBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  };
  // The keyboard animates in over ~350ms and iOS fires the resize
  // early — one measurement lands mid-animation (or before it), which
  // left sheets stranded until some scroll forced a re-measure. Settle
  // by re-syncing across the animation window.
  const settleViewport = () => {
    syncViewport();
    [80, 180, 320, 480, 650].forEach(ms => setTimeout(syncViewport, ms));
  };
  vv.addEventListener('resize', settleViewport);
  vv.addEventListener('scroll', syncViewport);
  window.addEventListener('focusin', settleViewport);
  window.addEventListener('focusout', settleViewport);
}

// Derive base path for proxy-safe URLs (e.g. "/app/acp-mobile/" -> "/app/acp-mobile")
const basePath = location.pathname.replace(/\/$/, '');

// Self-update: iOS standalone apps resume frozen pages indefinitely.
// When the server reports a different build, pull fresh code.
const BUILD_ID = '__BUILD_ID__';

let ws, nextId = 100, sessionId = null;
let currentAgentMsg = null;
let processing = false;
let reconnectAttempts = 0;
let reconnectTimer = null;
let isAtBottom = true;
let msgIdCounter = 0;
let projectCwd = null;
let currentSockPid = null;
let currentBufferName = null;

// Permission state
let pendingPermissions = []; // [{id, element}]

// Mode state
let currentMode = 'default';
let availableModes = [];
let replayMode = false;
let replayBuffer = [];
let replayTimer = null;
let allReplayTurns = [];  // Full history from replay
let renderedTurnStart = 0; // Index into allReplayTurns of first rendered turn
// Mode display: look up name from availableModes, fall back to id
function modeName(id) {
  const mode = availableModes.find(m => m.id === id);
  return mode ? mode.name : id;
}
function modeColor(id) {
  // Heuristic coloring based on common mode semantics
  const lower = id.toLowerCase();
  if (lower.includes('yolo') || lower.includes('bypass')) return '#fb4934';
  if (lower.includes('plan') || lower.includes('architect')) return '#fabd2f';
  if (lower.includes('edit') || lower.includes('code') || lower.includes('auto')) return '#b8bb26';
  if (lower.includes('dont') || lower.includes("don't")) return '#83a598';
  return '#928374';
}

// --- Markdown renderer (basic, no dependencies) ---

function renderMarkdown(text) {
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Fenced code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) =>
    '<pre><code>' + code.trimEnd() + '</code></pre>');

  // Inline code
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

  // Headings
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Horizontal rule
  html = html.replace(/^---+$/gm, '<hr>');

  // Bold and italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links (only allow http/https, escape quotes to prevent attribute injection)
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, url) => {
    if (/^https?:\/\//i.test(url)) {
      var safeUrl = url.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      return '<a href="' + safeUrl + '" target="_blank" rel="noopener">' + text + '</a>';
    }
    return text + ' (' + url + ')';
  });

  // Blockquotes
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Unordered lists
  html = html.replace(/^(?:- |\* )(.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, (m) => '<ul>' + m + '</ul>');

  // Paragraphs
  html = html.replace(/\n\n+/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');

  return '<p>' + html + '</p>';
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderDiff(oldStr, newStr) {
  const oldLines = oldStr.split('\n');
  const newLines = newStr.split('\n');
  let html = '';
  for (const line of oldLines) {
    html += '<span class="diff-removed">- ' + escHtml(line) + '</span>\n';
  }
  for (const line of newLines) {
    html += '<span class="diff-added">+ ' + escHtml(line) + '</span>\n';
  }
  return html;
}

function shortPath(p) {
  return p ? p.replace(/^\/Users\/[^/]+/, '~') : '';
}

function formatTime(d) {
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

// --- Message display ---

function addUserMsg(text, status) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.id = 'msg-' + (++msgIdCounter);
  const time = formatTime(new Date());
  const deliveryIcon = status === 'queued' ? '&#9201;' : status === 'sending' ? '&#9675;' : '&#10003;';
  d.innerHTML =
    '<span class="role">You</span>' +
    '<div class="text">' + escHtml(text) + '</div>' +
    '<div class="meta"><span class="time">' + time + '</span>' +
    '<span class="delivery">' + deliveryIcon + '</span></div>';
  d.addEventListener('contextmenu', (e) => { e.preventDefault(); copyText(text); });
  const live = status === 'sending' || status === 'queued';
  if (live) d.classList.add('msg-in');
  messagesEl.appendChild(d);
  if (isAtBottom) scrollToBottom(live);
  return d;
}

function markSent(el) {
  const delivery = el.querySelector('.delivery');
  if (delivery) delivery.innerHTML = '&#10003;';
}

function addAgentMsg(text) {
  const d = document.createElement('div');
  d.className = 'msg agent';
  d.id = 'msg-' + (++msgIdCounter);
  d.innerHTML =
    '<span class="role">Agent</span>' +
    '<div class="md">' + renderMarkdown(text) + '</div>';
  d._text = text;
  d.addEventListener('contextmenu', (e) => { e.preventDefault(); copyText(d._text); });
  messagesEl.appendChild(d);
  if (isAtBottom) scrollToBottom();
  return d;
}

function updateAgentMsg(el, text) {
  el._text = text;
  el.querySelector('.md').innerHTML = renderMarkdown(text);
  if (isAtBottom) scrollToBottom();
}

function addToolMsg(toolName, params, type) {
  const d = document.createElement('div');
  d.className = 'msg tool';
  d.id = 'msg-' + (++msgIdCounter);

  const cleanType = (type || toolName).replace('mcp__acp__', '');

  // Pick icon based on tool type
  let icon = '\u2699'; // gear
  if (cleanType === 'Read') icon = '\uD83D\uDCD6';
  else if (cleanType === 'Write') icon = '\uD83D\uDCDD';
  else if (cleanType === 'Edit') icon = '\u270F\uFE0F';
  else if (cleanType === 'Bash') icon = '\uD83D\uDCBB';
  else if (cleanType === 'Grep' || cleanType === 'Glob') icon = '\uD83D\uDD0D';

  // Extract subtitle (path/command) and description from params
  let subtitle = '';
  let titleText = toolName;
  if (params) {
    subtitle = params.file_path || params.path || params.command || '';
    if (params.description) titleText = params.description;
  }

  let infoHtml = '<div class="tool-name">' + escHtml(titleText) + '</div>';
  if (subtitle) {
    infoHtml += '<div class="tool-path">' + escHtml(shortPath(subtitle)) + '</div>';
  }

  // Pre-populate tool body with input details for Edit/Write
  let bodyHtml = '';
  if (params && cleanType === 'Edit' && params.old_string) {
    bodyHtml = renderDiff(params.old_string, params.new_string || '');
  } else if (params && params.plan) {
    bodyHtml = '<div class="md">' + renderMarkdown(params.plan) + '</div>';
  } else if (params && cleanType === 'Write' && params.content) {
    const preview = params.content.length > 2000
      ? params.content.slice(0, 2000) + '\n... (truncated)'
      : params.content;
    bodyHtml = escHtml(preview);
  } else if (params) {
    // Show params summary for other tools (Grep pattern, Bash command, etc.)
    const parts = [];
    for (const [k, v] of Object.entries(params)) {
      if (k === 'file_path' || k === 'path' || k === 'command' || k === 'description') continue; // already in title/subtitle
      const s = typeof v === 'string' ? v : JSON.stringify(v);
      parts.push(k + ': ' + s);
    }
    if (parts.length) bodyHtml = escHtml(parts.join('\n'));
  }

  d.innerHTML =
    '<div class="tool-header">' +
      '<span class="tool-icon">' + icon + '</span>' +
      '<div class="tool-info">' + infoHtml + '</div>' +
      '<span class="tool-expand">&#9656;</span>' +
    '</div>' +
    '<div class="tool-body">' + bodyHtml + '</div>' +
    '<div class="tool-hint">' + (bodyHtml ? 'tap to view details' : 'tap to expand') + '</div>';
  d.onclick = () => d.classList.toggle('expanded');
  d.addEventListener('contextmenu', (e) => { e.preventDefault(); copyText(toolCopyText(d)); });
  messagesEl.appendChild(d);
  if (isAtBottom) scrollToBottom();
  return d;
}

function updateToolInfo(toolEl, name, params, type) {
  const cleanType = (type || name).replace('mcp__acp__', '');
  const nameEl = toolEl.querySelector('.tool-name');
  let titleText = name;
  if (params && params.description) titleText = params.description;
  if (nameEl) nameEl.textContent = titleText;

  let subtitle = '';
  if (params) subtitle = params.file_path || params.path || params.command || '';
  const pathEl = toolEl.querySelector('.tool-path');
  if (subtitle) {
    if (pathEl) {
      pathEl.textContent = shortPath(subtitle);
    } else {
      const infoEl = toolEl.querySelector('.tool-info');
      if (infoEl) {
        const p = document.createElement('div');
        p.className = 'tool-path';
        p.textContent = shortPath(subtitle);
        infoEl.appendChild(p);
      }
    }
  }

  // Update body with input details
  const body = toolEl.querySelector('.tool-body');
  if (body && !body.innerHTML.trim()) {
    let bodyHtml = '';
    if (params && cleanType === 'Edit' && params.old_string) {
      bodyHtml = renderDiff(params.old_string, params.new_string || '');
    } else if (params && params.plan) {
    bodyHtml = '<div class="md">' + renderMarkdown(params.plan) + '</div>';
  } else if (params && cleanType === 'Write' && params.content) {
      const preview = params.content.length > 2000
        ? params.content.slice(0, 2000) + '\n... (truncated)'
        : params.content;
      bodyHtml = escHtml(preview);
    } else if (params) {
      // Show params summary for other tools
      const parts = [];
      for (const [k, v] of Object.entries(params)) {
        if (k === 'file_path' || k === 'path' || k === 'command' || k === 'description') continue;
        const s = typeof v === 'string' ? v : JSON.stringify(v);
        parts.push(k + ': ' + s);
      }
      if (parts.length) bodyHtml = escHtml(parts.join('\n'));
    }
    if (bodyHtml) {
      body.innerHTML = bodyHtml;
      const hint = toolEl.querySelector('.tool-hint');
      if (hint) hint.textContent = 'tap to view details';
    }
  }
}

function updateToolStatus(toolEl, status, content) {
  const nameEl = toolEl.querySelector('.tool-name');
  if (nameEl) {
    nameEl.className = 'tool-name ' + status;
    // Update icon
    const iconEl = toolEl.querySelector('.tool-icon');
    if (status === 'completed') {
      iconEl.textContent = '\u2713';
    } else if (status === 'failed') {
      iconEl.textContent = '\u2717';
    }
  }
  const body = toolEl.querySelector('.tool-body');
  const hint = toolEl.querySelector('.tool-hint');
  if (content) {
    if (body) {
      if (body.innerHTML.trim()) {
        // Body has input params - add separator and append result
        const sep = document.createElement('hr');
        sep.style.cssText = 'border:none;border-top:1px solid #333;margin:8px 0';
        body.appendChild(sep);
        const out = document.createElement('div');
        out.textContent = content;
        body.appendChild(out);
      } else {
        body.textContent = content;
      }
    }
    if (hint) hint.textContent = 'tap to view details';
  } else if (body && body.innerHTML.trim()) {
    if (hint) hint.textContent = 'tap to view details';
  }
}

function addPermissionMsg(msg, interactive) {
  const params = msg.params || {};
  const tc = params.toolCall || {};
  const options = params.options || [];

  const d = document.createElement('div');
  d.className = 'msg permission' + (interactive ? '' : ' resolved');
  d.id = 'msg-' + (++msgIdCounter);

  // Icon based on tool kind
  const KIND_ICONS = {
    read: '\uD83D\uDCD6', edit: '\u270F\uFE0F', delete: '\uD83D\uDDD1',
    execute: '\uD83D\uDCBB', search: '\uD83D\uDD0D', fetch: '\uD83C\uDF10',
    switch_mode: '\uD83D\uDCCB'
  };
  const icon = KIND_ICONS[tc.kind] || '\uD83D\uDD12';

  // Extract path from content or locations
  let filePath = '';
  if (tc.content && tc.content.length > 0) {
    filePath = tc.content[0].path || '';
  }
  if (!filePath && tc.locations && tc.locations.length > 0) {
    filePath = tc.locations[0].path || '';
  }

  let headerHtml =
    '<div class="perm-header">' +
      '<span class="perm-icon">' + icon + '</span>' +
      '<div class="perm-info">' +
        '<div class="perm-title">' + escHtml(tc.title || 'Permission required') + '</div>' +
        (filePath ? '<div class="perm-path">' + escHtml(shortPath(filePath)) + '</div>' : '') +
      '</div>' +
    '</div>';

  // Detail: show diff or text content
  let detailHtml = '';
  // ExitPlanMode: show the plan text from rawInput.plan
  if (tc.kind === 'switch_mode' && tc.rawInput && tc.rawInput.plan) {
    detailHtml = '<div class="perm-detail md">' + renderMarkdown(tc.rawInput.plan) + '</div>';
  } else if (tc.content && tc.content.length > 0) {
    const c = tc.content[0];
    if (c.type === 'diff' && c.oldText !== undefined) {
      detailHtml = '<div class="perm-detail">' + renderDiff(c.oldText, c.newText || '') + '</div>';
    } else if (c.type === 'text' && c.text) {
      const preview = c.text.length > 1000 ? c.text.slice(0, 1000) + '\n... (truncated)' : c.text;
      detailHtml = '<div class="perm-detail">' + escHtml(preview) + '</div>';
    } else if (c.type === 'terminal' && c.command) {
      detailHtml = '<div class="perm-detail">$ ' + escHtml(c.command) + '</div>';
    }
  }

  // Option buttons
  let optionsHtml = '';
  if (interactive && options.length > 0) {
    optionsHtml = '<div class="perm-options">';
    for (const opt of options) {
      let cls = 'perm-btn';
      if (opt.kind === 'allow_once') cls += ' allow';
      else if (opt.kind === 'allow_always') cls += ' allow-always';
      else if (opt.kind === 'reject_once') cls += ' reject';
      else if (opt.kind === 'reject_always') cls += ' reject-always';
      optionsHtml += '<button class="' + cls + '" data-option-id="' + escHtml(opt.optionId) + '">' +
        escHtml(opt.name) + '</button>';
    }
    optionsHtml += '</div>';
  }

  d.innerHTML = headerHtml + detailHtml + optionsHtml;

  if (interactive) {
    const buttons = d.querySelectorAll('.perm-btn');
    buttons.forEach(btn => {
      btn.onclick = () => {
        const optionId = btn.getAttribute('data-option-id');
        // Send response
        ws.send(JSON.stringify({
          jsonrpc: '2.0', id: msg.id,
          result: { outcome: { outcome: 'selected', optionId: optionId } }
        }));
        // Disable all buttons, highlight selected
        buttons.forEach(b => { b.disabled = true; });
        btn.classList.add('selected');
        d.classList.add('resolved');
        // Remove from pending
        pendingPermissions = pendingPermissions.filter(p => p.id !== msg.id);
      };
    });
    pendingPermissions.push({ id: msg.id, element: d });
  }

  messagesEl.appendChild(d);
  if (isAtBottom) scrollToBottom();
  return d;
}

// Add approve/reject buttons to a pending ExitPlanMode tool card.
// The card already shows the plan text; this adds interactive buttons.
function addPlanApprovalButtons(toolEl) {
  const btns = document.createElement('div');
  btns.className = 'perm-options';
  btns.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:0 12px 12px';

  const approveBtn = document.createElement('button');
  approveBtn.className = 'perm-btn allow';
  approveBtn.textContent = 'Approve';
  approveBtn.style.cssText = 'border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;background:#238636;color:#fff';

  const rejectBtn = document.createElement('button');
  rejectBtn.className = 'perm-btn reject';
  rejectBtn.textContent = 'Reject';
  rejectBtn.style.cssText = 'border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;background:#8b2020;color:#fff';

  function respond(approved) {
    // Check if there's a pending permission we can respond to
    const pending = pendingPermissions.find(p => true); // any pending permission
    if (pending) {
      const optionId = approved ? 'default' : (pending.element ? 'reject' : 'default');
      ws.send(JSON.stringify({
        jsonrpc: '2.0', id: pending.id,
        result: { outcome: { outcome: 'selected', optionId: approved ? 'default' : 'reject' } }
      }));
      pendingPermissions = pendingPermissions.filter(p2 => p2.id !== pending.id);
    } else {
      // No pending permission — send as a prompt
      if (sessionId && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({
          jsonrpc: '2.0', id: Date.now(),
          method: 'session/prompt',
          params: {
            sessionId: sessionId,
            prompt: [{ type: 'text', text: approved ? 'Yes, proceed with the plan.' : 'No, reject the plan.' }]
          }
        }));
      }
    }
    approveBtn.disabled = true;
    rejectBtn.disabled = true;
    (approved ? approveBtn : rejectBtn).style.outline = '2px solid #fff';
    (approved ? approveBtn : rejectBtn).style.outlineOffset = '1px';
    toolEl.classList.add('resolved');
  }

  approveBtn.onclick = (e) => { e.stopPropagation(); respond(true); };
  rejectBtn.onclick = (e) => { e.stopPropagation(); respond(false); };

  btns.appendChild(approveBtn);
  btns.appendChild(rejectBtn);

  // Make card expanded by default so plan text and buttons are visible
  toolEl.classList.add('expanded');
  toolEl.appendChild(btns);
}

// Terminal-style braille spinner (the rig is a terminal; so is this)
const SPINNER_FRAMES = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
let spinnerTimer = null, spinnerIdx = 0;
const spinnerGlyph = document.getElementById('spinner-glyph');
